<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Rodme Health</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F5F3EF;--surface:#FFFFFF;--surface2:#F9F8F6;--border:#E8E4DD;
  --text:#1C1917;--text2:#78716C;--text3:#A8A29E;
  --accent:#2D6A4F;--accent2:#52B788;--accent-bg:#EBF5F0;
  --warn:#C2410C;--warn-bg:#FEF3EE;
  --gold:#92400E;--gold-bg:#FFFBEB;
  --purple:#6B21A8;--purple-bg:#FAF5FF;
  --radius:14px;--radius-lg:20px;--radius-xl:28px;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 16px rgba(0,0,0,.04);
  --shadow-lg:0 4px 24px rgba(0,0,0,.08),0 1px 4px rgba(0,0,0,.04);
  --shadow-xl:0 12px 40px rgba(0,0,0,.12),0 2px 8px rgba(0,0,0,.06);
  --font-body:'Geist',system-ui,sans-serif;
  --font-display:'Instrument Serif',Georgia,serif;
  --transition:cubic-bezier(.22,1,.36,1);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:var(--font-body);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
input,textarea,select,button{font-family:var(--font-body)}
input,textarea,select{outline:none;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--radius);padding:11px 14px;font-size:.875rem;width:100%;color:var(--text);transition:border-color .2s,box-shadow .2s;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,106,79,.1)}
label{font-size:.7rem;font-weight:600;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px}
textarea{resize:vertical;line-height:1.5}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.96) translateY(6px)}to{opacity:1;transform:scale(1) translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
@keyframes shimmer{0%{background-position:-200% 0}100%{background-position:200% 0}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

.fu{animation:fadeUp .4s var(--transition) both}
.fi{animation:fadeIn .3s ease both}
.si{animation:scaleIn .35s var(--transition) both}
.s1{animation-delay:.04s}.s2{animation-delay:.08s}.s3{animation-delay:.12s}.s4{animation-delay:.16s}.s5{animation-delay:.20s}.s6{animation-delay:.24s}

/* Cards */
.card{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .25s var(--transition),box-shadow .25s ease}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-flat{background:var(--surface);border-radius:var(--radius-lg);border:1px solid var(--border)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;font-family:var(--font-body);font-weight:500;transition:all .18s var(--transition);border-radius:var(--radius)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--text);color:#fff;padding:13px 20px;font-size:.875rem;font-weight:600;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.btn-primary:hover{background:#2C2C2C;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.btn-accent{background:var(--accent);color:#fff;padding:13px 20px;font-size:.875rem;font-weight:600;box-shadow:0 2px 8px rgba(45,106,79,.25)}
.btn-accent:hover{background:#235c43}
.btn-ghost{background:transparent;color:var(--text2);padding:10px 14px;font-size:.8rem}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--warn-bg);color:var(--warn);padding:10px 14px;font-size:.8rem;border:1px solid #FECACA}
.btn-icon{background:transparent;border:none;padding:8px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s}
.btn-icon:hover{background:var(--surface2)}
.btn-icon:active{transform:scale(.93)}
.btn-full{width:100%}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border-radius:20px;font-size:.72rem;font-weight:600;letter-spacing:.02em}
.chip-green{background:var(--accent-bg);color:var(--accent)}
.chip-amber{background:var(--gold-bg);color:var(--gold)}
.chip-red{background:var(--warn-bg);color:var(--warn)}
.chip-purple{background:var(--purple-bg);color:var(--purple)}
.chip-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}

/* Tab selector */
.tab-bar{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;border:1px solid var(--border)}
.tab{flex:1;padding:8px;border:none;border-radius:9px;font-family:var(--font-body);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s;background:transparent;color:var(--text2)}
.tab.active{background:var(--surface);color:var(--text);font-weight:600;box-shadow:var(--shadow)}

/* Form row */
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

/* Modal */
.overlay{position:fixed;inset:0;background:rgba(28,25,23,.4);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .2s ease}
.sheet{background:var(--surface);border-radius:24px 24px 0 0;width:100%;max-width:540px;max-height:92vh;overflow-y:auto;animation:slideUp .35s var(--transition);padding:0 0 env(safe-area-inset-bottom,16px)}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:4px;margin:12px auto 0}
.sheet-header{padding:16px 22px 0;display:flex;align-items:center;justify-content:space-between}
.sheet-body{padding:16px 22px 24px}
.sheet-title{font-family:var(--font-display);font-size:1.3rem;color:var(--text)}
.sheet-sub{font-size:.72rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}

/* Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:blur(20px);border-top:1px solid var(--border);display:flex;z-index:50;padding-bottom:env(safe-area-inset-bottom,8px);box-shadow:0 -1px 0 var(--border)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 4px;background:none;border:none;cursor:pointer;position:relative;transition:opacity .15s}
.nav-btn span{font-size:.62rem;font-weight:500;color:var(--text3);transition:color .2s}
.nav-btn.active span{color:var(--accent);font-weight:600}
.nav-indicator{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:18px;height:2.5px;background:var(--accent);border-radius:2px 2px 0 0}
.nav-dot{width:6px;height:6px;background:var(--warn);border-radius:50%;position:absolute;top:6px;right:calc(50% - 14px);border:1.5px solid white}

/* Section headers */
.page-header{padding:20px 18px 8px}
.page-title{font-family:var(--font-display);font-size:1.7rem;color:var(--text);line-height:1.1}
.page-subtitle{font-size:.75rem;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:600;margin-bottom:2px}

/* Empty state */
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px;text-align:center;color:var(--text3)}
.empty-icon{width:56px;height:56px;background:var(--surface2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:14px;border:1px solid var(--border)}

/* Notification banner */
.notif-banner{background:var(--text);color:white;padding:11px 18px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;animation:slideDown .3s var(--transition)}

/* Info row in detail */
.info-row{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--surface2)}
.info-row:last-child{border-bottom:none}
.info-icon{width:32px;height:32px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px}
.info-label{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-bottom:2px}
.info-value{font-size:.875rem;font-weight:500;color:var(--text);line-height:1.4}
.info-sub{font-size:.75rem;color:var(--text2);margin-top:1px}

/* Avatar */
.avatar{border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:600;color:white;overflow:hidden;flex-shrink:0}

/* Quick stat cards */
.stat-card{background:var(--surface);border-radius:var(--radius-lg);padding:14px 16px;border:1px solid var(--border)}
.stat-val{font-family:var(--font-display);font-size:2rem;color:var(--text);line-height:1}
.stat-lbl{font-size:.7rem;color:var(--text3);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin-top:4px}

/* Upcoming card */
.apt-mini{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--radius);background:var(--surface);border:1px solid var(--border);margin-bottom:8px;transition:all .2s}
.apt-mini:hover{border-color:var(--accent);box-shadow:0 0 0 3px rgba(45,106,79,.07)}
.apt-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}

/* Swipeable action buttons on cards */
.apt-card{position:relative;overflow:hidden}

/* Toggle switch */
.toggle-wrap{display:flex;align-items:center;gap:10px;cursor:pointer}
.toggle{width:42px;height:24px;background:var(--border);border-radius:12px;position:relative;transition:background .2s;flex-shrink:0;cursor:pointer;border:none}
.toggle::after{content:'';position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:white;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.toggle.on{background:var(--accent)}
.toggle.on::after{transform:translateX(18px)}

/* Blood type buttons */
.bt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.bt-btn{padding:8px 4px;border-radius:9px;border:1.5px solid var(--border);background:transparent;font-family:var(--font-body);font-size:.8rem;font-weight:600;cursor:pointer;transition:all .15s;color:var(--text2);text-align:center}
.bt-btn.on{background:var(--accent);border-color:var(--accent);color:white}

/* Login screen */
.login-screen{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .3s ease}
.login-card{background:var(--surface);border-radius:var(--radius-xl);padding:36px 28px;width:100%;max-width:360px;box-shadow:var(--shadow-xl);border:1px solid var(--border)}
.login-logo{width:56px;height:56px;background:var(--text);border-radius:16px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px}

/* IMC badge */
.imc-badge{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;border-radius:10px;margin-top:6px}

/* Medication edit highlight */
.med-edit-bar{background:var(--gold-bg);border:1px solid #FDE68A;border-radius:10px;padding:8px 12px;margin-top:10px;font-size:.8rem;color:var(--gold)}
</style>
</head>

function fmtDateLong(d){if(!d)return'';return new Date(d+'T00:00:00').toLocaleDateString('es-CR',{day:'2-digit',month:'long',year:'numeric'});}
function fmtTime(t){if(!t)return'';var p=t.split(':'),hr=parseInt(p[0]);return(hr>12?hr-12:(hr||12))+':'+p[1]+' '+(hr>=12?'PM':'AM');}
function daysUntil(d){if(!d)return null;var today=new Date();today.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-today)/86400000);}

function ls(k,def){try{return JSON.parse(localStorage.getItem(k)||def);}catch(e){return JSON.parse(def||'null');}}

  return{patients:patients,setPatients:setPatients,appointments:apts,setAppointments:setApts,medications:meds,setMedications:setMeds};
}

  globe:function(s,c){return svgW(s,c,1.5,[h('circle',{key:'c',cx:'12',cy:'12',r:'9'}),h('line',{key:'a',x1:'3.6',y1:'9',x2:'20.4',y2:'9'}),h('line',{key:'b',x1:'3.6',y1:'15',x2:'20.4',y2:'15'}),h('path',{key:'p',d:'M11.5 3a17 17 0 000 18M12.5 3a17 17 0 010 18'})]);},

  function rhEnter(user){
    if(document.getElementById('rme-cb')&&document.getElementById('rme-cb').checked){
      localStorage.setItem(RH_KEY,JSON.stringify({u:user,t:Date.now()}));
    } else {
      sessionStorage.setItem(RH_KEY,JSON.stringify({u:user,t:Date.now()}));
    }

    try{

      // Google panel
      tab==='google'&&h('div',{style:{display:'flex',flexDirection:'column',gap:12}},

    +(pending.length>0?'<div style="margin-bottom:20px"><div style="background:#C2410C;border-radius:8px 8px 0 0;padding:8px 14px"><h3 style="color:white;font-size:12px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.05em">Citas Pendientes - '+pending.length+'</h3></div><div style="border:1px solid #E5E7EB;border-top:none;border-radius:0 0 8px 8px;padding:10px">'+pending.map(aptCard).join('')+'</div></div>':'')
    +(attended.length>0?'<div style="margin-bottom:20px"><div style="background:#2D6A4F;border-radius:8px 8px 0 0;padding:8px 14px"><h3 style="color:white;font-size:12px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.05em">Citas Asistidas - '+attended.length+'</h3></div><div style="border:1px solid #E5E7EB;border-top:none;border-radius:0 0 8px 8px;padding:10px">'+attended.map(aptCard).join('')+'</div></div>':'')
    +(meds.length>0?'<div style="margin-bottom:20px"><div style="background:#7C3AED;border-radius:8px 8px 0 0;padding:8px 14px"><h3 style="color:white;font-size:12px;font-weight:700;margin:0;text-transform:uppercase;letter-spacing:.05em">Medicamentos - '+meds.length+'</h3></div><div style="border:1px solid #E5E7EB;border-top:none;border-radius:0 0 8px 8px;padding:10px">'+meds.map(medCard).join('')+'</div></div>':'')
    +'<div style="margin-top:24px;padding-top:12px;border-top:1px solid #E5E7EB;display:flex;justify-content:space-between">'
      +'<span style="font-size:10px;color:#9CA3AF">Rodme Health \u00b7 '+today+'</span>'
      +'<span style="font-size:10px;color:#9CA3AF">Confidencial \u00b7 Solo uso medico</span>'
    +'</div>'
    +'<div class="no-print" style="margin-top:24px;display:flex;gap:10px;justify-content:center">'
      +'<button onclick="window.print()" style="padding:12px 28px;background:#111827;border:none;color:white;font-size:13px;font-weight:700;border-radius:10px;cursor:pointer">Descargar PDF</button>'
      +'<button onclick="window.close()" style="padding:12px 20px;background:#F3F4F6;border:1px solid #E5E7EB;color:#374151;font-size:13px;font-weight:500;border-radius:10px;cursor:pointer">Cerrar</button>'
    +'</div>'
    +'</body></html>';
  var win=window.open('','_blank');win.document.write(html);win.document.close();
}

// ── main app ───────────────────────────────────────────────────────────────
function App(){
  var RH_KEY='rh_session';
  function checkSession(){try{var raw=sessionStorage.getItem(RH_KEY)||localStorage.getItem(RH_KEY);var s=raw?JSON.parse(raw):null;return s&&s.u?s.u:null;}catch(e){return null;}}
  var us=useState(checkSession());var user=us[0],setUser=us[1];
  var store=useStore();
  var vs=useState('home');var view=vs[0],setView=vs[1];
  var ms=useState(null);var modal=ms[0],setModal=ms[1];
  var ps=useState(null);var selP=ps[0],setSelP=ps[1];
  var as=useState(null);var selA=as[0],setSelA=as[1];
  var smS=useState(null);var selM=smS[0],setSelM=smS[1];
  var ts=useState('pending');var tab=ts[0],setTab=ts[1];
  var ns=useState([]);var notifs=ns[0],setNotifs=ns[1];
  var nb=useState(true);var showBanner=nb[0],setShowBanner=nb[1];

  useEffect(function(){
    setNotifs(store.appointments.filter(function(a){var d=daysUntil(a.date);return d!==null&&d>=0&&d<=7&&!a.attended;}));
  },[store.appointments]);

  if(!user){return h(LoginScreen,{onLogin:function(u){setUser(u);}});}

  return h('div',{style:{fontFamily:'var(--font-body)',background:'var(--bg)',minHeight:'100vh',color:'var(--text)'}},
    // Notif banner
    notifs.length>0&&view==='home'&&showBanner&&h('div',{className:'notif-banner'},
      h(Ic,{n:'bell',s:15,c:'white'}),
      h('span',{style:{flex:1,fontSize:'.82rem',fontWeight:500}},notifs.length+' cita'+(notifs.length>1?'s':'') +' proxima'+(notifs.length>1?'s':'')+' esta semana'),
      h('button',{onClick:function(){setTab('pending');setView('appointments');},style:{background:'rgba(255,255,255,.2)',border:'none',color:'white',padding:'3px 10px',borderRadius:20,fontSize:'.75rem',cursor:'pointer',fontFamily:'var(--font-body)',fontWeight:600}},'Ver'),
      h('button',{onClick:function(){setShowBanner(false);},style:{background:'none',border:'none',color:'white',cursor:'pointer',padding:4}},h(Ic,{n:'close',s:14,c:'white'}))
    ),

    // Views
    view==='home'&&h(HomeView,{store:store,setView:setView,setModal:setModal,setSelAppt:setSelA,user:user,notifs:notifs.length}),
    view==='patients'&&h(PatientsView,{store:store,setModal:setModal,setSelPatient:setSelP}),
    view==='appointments'&&h(ApptsView,{store:store,setModal:setModal,tab:tab,setTab:setTab,setSelAppt:setSelA}),
    view==='medications'&&h(MedsView,{store:store,setModal:setModal,setSelMed:setSelM}),
    view==='settings'&&h(SettingsView,{store:store,setView:setView}),
    view==='record'&&h(RecordView,{store:store,setView:setView}),

    h(BottomNav,{view:view,setView:setView,notifs:notifs.length}),

    // Modals
    modal==='add-patient'&&h(PatientModal,{store:store,onClose:function(){setModal(null);}}),
    modal==='edit-patient'&&h(PatientModal,{store:store,patient:selP,onClose:function(){setModal(null);}}),
    modal==='add-apt'&&h(AptModal,{store:store,onClose:function(){setModal(null);},prePatient:selP}),
    modal==='edit-apt'&&h(AptModal,{store:store,appt:selA,onClose:function(){setModal(null);}}),
    modal==='view-apt'&&h(AptDetail,{store:store,appt:selA,onClose:function(){setModal(null);},onEdit:function(){setModal('edit-apt');}}),
    modal==='add-med'&&h(MedModal,{store:store,onClose:function(){setModal(null);},prePatient:selP}),
    modal==='edit-med'&&h(MedModal,{store:store,med:selM,onClose:function(){setModal(null);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
