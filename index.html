<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<title>Rodme Health</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,400;12..96,500;12..96,600;12..96,700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#F8F7F4;--surface:#FFFFFF;--surface2:#F2F0EC;--border:#E6E2DA;
  --text:#18181B;--text2:#52525B;--text3:#A1A1AA;
  --accent:#18794E;--accent2:#4ADE80;--accent-bg:#F0FDF4;--accent-border:#86EFAC;
  --amber:#92400E;--amber-bg:#FFFBEB;--amber-border:#FDE68A;
  --red:#B91C1C;--red-bg:#FEF2F2;--red-border:#FECACA;
  --blue:#1D4ED8;--blue-bg:#EFF6FF;
  --purple:#6D28D9;--purple-bg:#F5F3FF;
  --shadow-sm:0 1px 2px rgba(0,0,0,.05);
  --shadow:0 1px 3px rgba(0,0,0,.07),0 6px 20px rgba(0,0,0,.04);
  --shadow-lg:0 4px 24px rgba(0,0,0,.09),0 1px 4px rgba(0,0,0,.05);
  --shadow-xl:0 20px 60px rgba(0,0,0,.14),0 4px 16px rgba(0,0,0,.06);
  --r:12px;--r-lg:18px;--r-xl:24px;--r-full:999px;
  --font:'Bricolage Grotesque',system-ui,sans-serif;
  --font-serif:'Lora',Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
}
[data-theme=dark]{
  --bg:#0C0A09;--surface:#1C1917;--surface2:#292524;--border:#3F3F3F;
  --text:#FAFAF9;--text2:#A8A29E;--text3:#57534E;
  --accent:#4ADE80;--accent-bg:#052E16;--accent-border:#166534;
  --amber-bg:#1C1400;--red-bg:#1A0000;--blue-bg:#0D1A3A;--purple-bg:#1A0D3A;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow:0 1px 3px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.3);
  --shadow-lg:0 4px 24px rgba(0,0,0,.5);
  --shadow-xl:0 20px 60px rgba(0,0,0,.6);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
::-webkit-scrollbar{width:0}
input,textarea,select,button{font-family:var(--font)}
input,textarea,select{outline:none;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--r);padding:11px 14px;font-size:.9rem;width:100%;color:var(--text);transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(74,222,128,.12)}
label{font-size:.7rem;font-weight:600;color:var(--text2);letter-spacing:.07em;text-transform:uppercase;display:block;margin-bottom:5px}
textarea{resize:vertical;line-height:1.6}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
@keyframes slideDown{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
@keyframes scaleIn{from{opacity:0;transform:scale(.94)}to{opacity:1;transform:scale(1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}

.fade-in{animation:fadeIn .35s var(--ease) both}
.slide-up{animation:slideUp .4s var(--ease) both}
.scale-in{animation:scaleIn .3s var(--ease) both}
.d1{animation-delay:.05s}.d2{animation-delay:.1s}.d3{animation-delay:.15s}.d4{animation-delay:.2s}.d5{animation-delay:.25s}.d6{animation-delay:.3s}

/* Cards */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
.card-flat{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;font-family:var(--font);font-weight:600;transition:all .16s var(--ease);border-radius:var(--r);letter-spacing:-.01em}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--text);color:var(--bg);padding:13px 20px;font-size:.875rem;box-shadow:var(--shadow-sm)}
.btn-primary:hover{opacity:.88}
.btn-accent{background:var(--accent);color:white;padding:13px 20px;font-size:.875rem}
.btn-ghost{background:transparent;color:var(--text2);padding:9px 14px;font-size:.8rem;font-weight:500}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-danger{background:var(--red-bg);color:var(--red);padding:10px 14px;font-size:.8rem;border:1px solid var(--red-border)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);padding:10px 16px;font-size:.875rem}
.btn-outline:hover{border-color:var(--text);background:var(--surface2)}
.btn-icon{background:transparent;border:none;padding:7px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s,transform .1s;color:var(--text2)}
.btn-icon:hover{background:var(--surface2);color:var(--text)}
.btn-icon:active{transform:scale(.9)}
.btn-full{width:100%}

/* Pill tabs */
.pill-tabs{display:flex;background:var(--surface2);border-radius:var(--r-full);padding:3px;gap:2px;border:1px solid var(--border)}
.pill-tab{flex:1;padding:8px 12px;border:none;border-radius:var(--r-full);font-family:var(--font);font-size:.8rem;font-weight:500;cursor:pointer;transition:all .2s var(--ease);background:transparent;color:var(--text2);letter-spacing:-.01em}
.pill-tab.active{background:var(--surface);color:var(--text);font-weight:700;box-shadow:var(--shadow-sm)}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:var(--r-full);font-size:.7rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip-green{background:var(--accent-bg);color:var(--accent);border:1px solid var(--accent-border)}
.chip-amber{background:var(--amber-bg);color:var(--amber);border:1px solid var(--amber-border)}
.chip-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.chip-purple{background:var(--purple-bg);color:var(--purple)}
.chip-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.chip-blue{background:var(--blue-bg);color:var(--blue)}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s ease}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:560px;max-height:94vh;overflow-y:auto;animation:sheetUp .3s var(--ease);padding-bottom:env(safe-area-inset-bottom,20px)}
.sheet-grip{width:32px;height:4px;background:var(--border);border-radius:var(--r-full);margin:10px auto 0}
.sheet-hd{padding:14px 20px 0;display:flex;align-items:flex-start;justify-content:space-between}
.sheet-bd{padding:16px 20px 24px}
.sheet-title{font-family:var(--font-serif);font-size:1.25rem;color:var(--text);font-weight:600}
.sheet-sub{font-size:.68rem;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:3px}

/* Nav */
.bottom-nav{position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--border);display:flex;z-index:50;padding:6px 0 env(safe-area-inset-bottom,8px)}
[data-theme=dark] .bottom-nav{background:rgba(28,25,23,.92)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 4px;background:none;border:none;cursor:pointer;position:relative;transition:opacity .15s}
.nav-lbl{font-size:.6rem;font-weight:600;color:var(--text3);letter-spacing:.03em;transition:color .2s}
.nav-btn.active .nav-lbl{color:var(--accent)}
.nav-pill{position:absolute;bottom:0;left:50%;transform:translateX(-50%);width:22px;height:3px;background:var(--accent);border-radius:var(--r-full)}
.nav-dot{width:6px;height:6px;background:var(--red);border-radius:50%;position:absolute;top:4px;right:calc(50% - 16px);border:2px solid var(--surface)}

/* Page header */
.ph{padding:20px 18px 14px;background:var(--surface);border-bottom:1px solid var(--border);margin-bottom:12px}
.ph-sub{font-size:.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
.ph-title{font-family:var(--font-serif);font-size:1.6rem;color:var(--text);line-height:1}

/* Info rows */
.ir{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--surface2)}
.ir:last-child{border-bottom:none}
.ir-ico{width:30px;height:30px;border-radius:9px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ir-lbl{font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:2px}
.ir-val{font-size:.875rem;font-weight:500;color:var(--text);line-height:1.4}
.ir-sub{font-size:.75rem;color:var(--text2);margin-top:1px}

/* Avatar */
.av{border-radius:50%;background:linear-gradient(135deg,var(--accent),#22C55E);display:flex;align-items:center;justify-content:center;font-weight:700;color:white;overflow:hidden;flex-shrink:0;letter-spacing:-.02em}

/* Stat grid */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;padding:0 14px;margin-bottom:14px}
.stat{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;border:1px solid var(--border);transition:transform .2s}
.stat:hover{transform:translateY(-2px)}
.stat-num{font-family:var(--font-serif);font-size:2rem;line-height:1;margin-bottom:4px}
.stat-lbl{font-size:.68rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}

/* Login */
.login-bg{position:fixed;inset:0;background:var(--bg);z-index:9999;display:flex;align-items:center;justify-content:center;padding:24px;animation:fadeIn .4s ease}
.login-card{background:var(--surface);border-radius:var(--r-xl);padding:40px 32px;width:100%;max-width:380px;box-shadow:var(--shadow-xl);border:1px solid var(--border);animation:scaleIn .4s var(--ease)}

/* Blood type */
.bt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.bt-btn{padding:8px;border-radius:10px;border:1.5px solid var(--border);background:transparent;font-family:var(--font);font-size:.8rem;font-weight:700;cursor:pointer;transition:all .15s;color:var(--text2);text-align:center}
.bt-btn.on{background:var(--accent);border-color:var(--accent);color:white}

/* IMC */
.imc{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:9px;margin-top:6px;font-size:.82rem;font-weight:700}

/* Section divider */
.divider{height:1px;background:var(--border);margin:4px 0}

/* Form row */
.fr{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:52px 24px;color:var(--text3)}
.empty-ico{width:52px;height:52px;background:var(--surface2);border-radius:16px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border:1px solid var(--border)}

/* Notif */
.notif{background:var(--text);color:var(--bg);padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:100;animation:slideDown .3s var(--ease);font-size:.82rem}

/* APT card accent bar */
.apt-bar{position:absolute;left:0;top:0;bottom:0;width:3px;border-radius:var(--r) 0 0 var(--r)}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
var h=React.createElement,useState=React.useState,useEffect=React.useEffect,useRef=React.useRef;

// ── UTILS ──────────────────────────────────────────────────────────────────
function fmtD(d){if(!d)return'';return new Date(d+'T00:00:00').toLocaleDateString('es-CR',{day:'2-digit',month:'short',year:'numeric'});}
function fmtDL(d){if(!d)return'';return new Date(d+'T00:00:00').toLocaleDateString('es-CR',{day:'2-digit',month:'long',year:'numeric'});}
function fmtT(t){if(!t)return'';var p=t.split(':'),hr=parseInt(p[0]);return(hr>12?hr-12:(hr||12))+':'+p[1]+' '+(hr>=12?'PM':'AM');}
function du(d){if(!d)return null;var today=new Date();today.setHours(0,0,0,0);return Math.round((new Date(d+'T00:00:00')-today)/86400000);}
function b64(f){return new Promise(function(r,j){var x=new FileReader();x.onload=function(){r(x.result);};x.onerror=j;x.readAsDataURL(f);});}
function uid(){return Math.random().toString(36).slice(2,10);}
function ini(n){return(n||'').split(' ').map(function(w){return w[0]||'';}).join('').slice(0,2).toUpperCase()||'?';}
function xt(a,b){return Object.assign({},a,b);}

// ── DATA KEYS (per user) ───────────────────────────────────────────────────
// Data is stored per-user-key so switching Google accounts doesn't mix data
function userKey(userEmail,suffix){
  var k=userEmail?userEmail.replace(/[^a-z0-9]/gi,'_').toLowerCase():'shared';
  return 'rh_'+k+'_'+suffix;
}
function lsGet(key,def){try{var v=localStorage.getItem(key);return v?JSON.parse(v):JSON.parse(def);}catch(e){return JSON.parse(def||'null');}}
function lsSet(key,val){try{localStorage.setItem(key,JSON.stringify(val));}catch(e){}}

// ── STORE ──────────────────────────────────────────────────────────────────
function useStore(userEmail){
  var pk=userKey(userEmail,'patients');
  var ak=userKey(userEmail,'apts');
  var mk=userKey(userEmail,'meds');
  var p=useState(function(){return lsGet(pk,'[]');});
  var a=useState(function(){return lsGet(ak,'[]');});
  var m=useState(function(){return lsGet(mk,'[]');});
  var patients=p[0],setP=p[1];
  var apts=a[0],setA=a[1];
  var meds=m[0],setM=m[1];
  useEffect(function(){lsSet(pk,patients);},[patients,pk]);
  useEffect(function(){lsSet(ak,apts);},[apts,ak]);
  useEffect(function(){lsSet(mk,meds);},[meds,mk]);
  function setPatients(fn){setP(function(prev){var next=typeof fn==='function'?fn(prev):fn;lsSet(pk,next);return next;});}
  function setAppointments(fn){setA(function(prev){var next=typeof fn==='function'?fn(prev):fn;lsSet(ak,next);return next;});}
  function setMedications(fn){setM(function(prev){var next=typeof fn==='function'?fn(prev):fn;lsSet(mk,next);return next;});}
  return{patients:patients,setPatients:setPatients,appointments:apts,setAppointments:setAppointments,medications:meds,setMedications:setMedications};
}

// ── ICONS ──────────────────────────────────────────────────────────────────
function sv(s,c,sw,ch){return h('svg',{width:s,height:s,fill:'none',stroke:c||'currentColor',strokeWidth:sw||'1.6',viewBox:'0 0 24 24',strokeLinecap:'round',strokeLinejoin:'round'},ch);}
var IC={
  home:function(s,c){return sv(s,c,1.6,[h('path',{key:'a',d:'M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z'}),h('polyline',{key:'b',points:'9 22 9 12 15 12 15 22'})]);},
  user:function(s,c){return sv(s,c,1.6,[h('circle',{key:'c',cx:'12',cy:'8',r:'4'}),h('path',{key:'p',d:'M4 20c0-4 3.6-7 8-7s8 3 8 7'})]);},
  calendar:function(s,c){return sv(s,c,1.6,[h('rect',{key:'r',x:'3',y:'4',width:'18',height:'18',rx:'2'}),h('path',{key:'p',d:'M16 2v4M8 2v4M3 10h18'})]);},
  pill:function(s,c){return sv(s,c,1.6,[h('path',{key:'a',d:'M4.5 12.5L12.5 4.5a4.95 4.95 0 017 7l-8 8a4.95 4.95 0 01-7-7z'}),h('line',{key:'b',x1:'9',y1:'9',x2:'15',y2:'15'})]);},
  settings:function(s,c){return sv(s,c,1.6,[h('circle',{key:'c',cx:'12',cy:'12',r:'3'}),h('path',{key:'p',d:'M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83-2.83l.06-.06A1.65 1.65 0 004.68 15a1.65 1.65 0 00-1.51-1H3a2 2 0 010-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 012.83-2.83l.06.06A1.65 1.65 0 009 4.68a1.65 1.65 0 001-1.51V3a2 2 0 014 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 010 4h-.09a1.65 1.65 0 00-1.51 1z'})]);},
  plus:function(s,c){return sv(s,c,1.8,[h('line',{key:'a',x1:'12',y1:'5',x2:'12',y2:'19'}),h('line',{key:'b',x1:'5',y1:'12',x2:'19',y2:'12'})]);},
  check:function(s,c){return sv(s,c,2,h('polyline',{points:'20 6 9 17 4 12'}));},
  close:function(s,c){return sv(s,c,1.6,[h('line',{key:'a',x1:'18',y1:'6',x2:'6',y2:'18'}),h('line',{key:'b',x1:'6',y1:'6',x2:'18',y2:'18'})]);},
  edit:function(s,c){return sv(s,c,1.6,[h('path',{key:'a',d:'M11 4H4a2 2 0 00-2 2v14a2 2 0 002 2h14a2 2 0 002-2v-7'}),h('path',{key:'b',d:'M18.5 2.5a2.121 2.121 0 013 3L12 15l-4 1 1-4 9.5-9.5z'})]);},
  trash:function(s,c){return sv(s,c,1.6,[h('polyline',{key:'a',points:'3 6 5 6 21 6'}),h('path',{key:'b',d:'M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6m3 0V4a1 1 0 011-1h4a1 1 0 011 1v2'})]);},
  bell:function(s,c){return sv(s,c,1.6,[h('path',{key:'a',d:'M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9'}),h('path',{key:'b',d:'M10.3 21a1.94 1.94 0 003.4 0'})]);},
  clock:function(s,c){return sv(s,c,1.6,[h('circle',{key:'c',cx:'12',cy:'12',r:'9'}),h('polyline',{key:'p',points:'12 7 12 12 15 15'})]);},
  hospital:function(s,c){return sv(s,c,1.6,[h('rect',{key:'r',x:'2',y:'6',width:'20',height:'15',rx:'1'}),h('path',{key:'p',d:'M8 21V12h8v9M9 9h6M12 6V3'})]);},
  file:function(s,c){return sv(s,c,1.6,[h('path',{key:'a',d:'M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z'}),h('polyline',{key:'b',points:'14 2 14 8 20 8'})]);},
  money:function(s,c){return sv(s,c,1.6,[h('rect',{key:'a',x:'1',y:'4',width:'22',height:'16',rx:'2'}),h('line',{key:'b',x1:'1',y1:'10',x2:'23',y2:'10'})]);},
  alert:function(s,c){return sv(s,c,1.6,[h('path',{key:'a',d:'M10.29 3.86L1.82 18a2 2 0 001.71 3h16.94a2 2 0 001.71-3L13.71 3.86a2 2 0 00-3.42 0z'}),h('line',{key:'b',x1:'12',y1:'9',x2:'12',y2:'13'}),h('line',{key:'c',x1:'12',y1:'17',x2:'12.01',y2:'17'})]);},
  camera:function(s,c){return sv(s,c,1.6,[h('path',{key:'p',d:'M23 19a2 2 0 01-2 2H3a2 2 0 01-2-2V8a2 2 0 012-2h4l2-3h6l2 3h4a2 2 0 012 2z'}),h('circle',{key:'c',cx:'12',cy:'13',r:'4'})]);},
  back:function(s,c){return sv(s,c,1.6,[h('line',{key:'a',x1:'19',y1:'12',x2:'5',y2:'12'}),h('polyline',{key:'b',points:'12 19 5 12 12 5'})]);},

    +sec('Datos Vitales','#18794E',row('Tipo de sangre',record.bloodType)+row('Peso',record.weight?record.weight+' kg':'')+row('Altura',record.height?record.height+' cm':'')+row('IMC',bmi))
    +sec('Alergias y Condiciones','#D97706',row('Alergias',record.allergies)+row('Condiciones',record.chronicConditions))
    +sec('Historial Medico','#1D4ED8',row('Cirugias',record.surgeries)+row('Antecedentes',record.familyHistory)+row('Vacunas',record.vaccines))
    +sec('Seguro y Emergencias','#7C3AED',row('Aseguradora',record.insurance)+row('Poliza',record.insuranceNumber)+row('Contacto',record.emergencyContact)+row('Telefono',record.emergencyPhone))
    +(record.notes?sec('Notas','#4B5563',row('Notas',record.notes)):'')
    +(pen.length>0?'<div style="margin-bottom:18px"><div style="background:#B91C1C;border-radius:8px 8px 0 0;padding:8px 14px"><h3 style="color:white;font-size:11px;font-weight:800;margin:0;text-transform:uppercase;letter-spacing:.06em">Citas Pendientes ('+pen.length+')</h3></div><div style="border:1px solid #E5E7EB;border-top:none;border-radius:0 0 8px 8px;padding:8px">'+pen.map(aptC).join('')+'</div></div>':'')
    +(att.length>0?'<div style="margin-bottom:18px"><div style="background:#18794E;border-radius:8px 8px 0 0;padding:8px 14px"><h3 style="color:white;font-size:11px;font-weight:800;margin:0;text-transform:uppercase;letter-spacing:.06em">Citas Asistidas ('+att.length+')</h3></div><div style="border:1px solid #E5E7EB;border-top:none;border-radius:0 0 8px 8px;padding:8px">'+att.map(aptC).join('')+'</div></div>':'')
    +(meds.length>0?'<div style="margin-bottom:18px"><div style="background:#7C3AED;border-radius:8px 8px 0 0;padding:8px 14px"><h3 style="color:white;font-size:11px;font-weight:800;margin:0;text-transform:uppercase;letter-spacing:.06em">Medicamentos ('+meds.length+')</h3></div><div style="border:1px solid #E5E7EB;border-top:none;border-radius:0 0 8px 8px;padding:8px">'+meds.map(medC).join('')+'</div></div>':'')
    +'<div style="margin-top:20px;padding-top:10px;border-top:1px solid #E5E7EB;display:flex;justify-content:space-between"><span style="font-size:10px;color:#9CA3AF">Rodme Health \u00b7 '+today+'</span><span style="font-size:10px;color:#9CA3AF">Confidencial</span></div>'
    +'<div class="np" style="margin-top:20px;display:flex;gap:10px;justify-content:center"><button onclick="window.print()" style="padding:11px 26px;background:#111827;border:none;color:white;font-size:13px;font-weight:700;border-radius:999px;cursor:pointer">Descargar PDF</button><button onclick="window.close()" style="padding:11px 18px;background:#F3F4F6;border:1px solid #E5E7EB;color:#374151;font-size:13px;border-radius:999px;cursor:pointer">Cerrar</button></div>'
    +'</body></html>';
  var win=window.open('','_blank');win.document.write(html);win.document.close();
}

// ── APP ────────────────────────────────────────────────────────────────────
function App(){
  // Theme
  var th=useState(function(){return localStorage.getItem('rh_theme')||'light';});
  var theme=th[0],setThemeState=th[1];
  function setTheme(t){setThemeState(t);localStorage.setItem('rh_theme',t);document.documentElement.setAttribute('data-theme',t);}
  useEffect(function(){document.documentElement.setAttribute('data-theme',theme);},[theme]);

  // Auth - check session stored under per-user key
  function getSession(){
    try{
      var raw=sessionStorage.getItem('rh_session')||localStorage.getItem('rh_session');
      if(raw){var s=JSON.parse(raw);if(s&&s.u)return s.u;}
    }catch(e){}
    return null;
  }
  var us=useState(getSession);var user=us[0],setUser=us[1];

  // Store keyed by user
  var store=useStore(user||'anon');

  var vs=useState('home');var view=vs[0],sv=vs[1];
  var ms=useState(null);var modal=ms[0],sm=ms[1];
  var ps=useState(null);var selP=ps[0],ssp=ps[1];
  var as=useState(null);var selA=as[0],ssa=as[1];
  var smS=useState(null);var selM=smS[0],ssm=smS[1];
  var ts=useState('pending');var tab=ts[0],stab=ts[1];
  var nb=useState([]);var notifs=nb[0],sn=nb[1];
  var bb=useState(true);var showB=bb[0],ssb=bb[1];

  useEffect(function(){sn(store.appointments.filter(function(a){var d=du(a.date);return d!==null&&d>=0&&d<=7&&!a.attended;}));},[store.appointments]);

  function onLogin(u){
    // Save session
    sessionStorage.setItem('rh_session',JSON.stringify({u:u,t:Date.now()}));
    setUser(u);
  }

  if(!user){return h(LoginScreen,{onLogin:onLogin});}

  return h('div',{style:{fontFamily:'var(--font)',background:'var(--bg)',minHeight:'100vh',color:'var(--text)'}},
    notifs.length>0&&view==='home'&&showB&&h('div',{className:'notif'},
      h(Ic,{n:'bell',s:14,c:'var(--bg)'}),
      h('span',{style:{flex:1,fontWeight:600}},notifs.length+' cita'+(notifs.length>1?'s':'') +' proxima'+(notifs.length>1?'s':'')+' esta semana'),
      h('button',{onClick:function(){stab('pending');sv('appointments');},style:{background:'rgba(255,255,255,.2)',border:'none',color:'var(--bg)',padding:'3px 10px',borderRadius:'var(--r-full)',fontSize:'.72rem',cursor:'pointer',fontFamily:'var(--font)',fontWeight:700}},'Ver'),
      h('button',{onClick:function(){ssb(false);},style:{background:'none',border:'none',color:'var(--bg)',cursor:'pointer',padding:4}},h(Ic,{n:'close',s:13,c:'var(--bg)'}))
    ),
    view==='home'&&h(HomeView,{store:store,sv:sv,sm:sm,sa:ssa,user:user,notifs:notifs.length}),
    view==='patients'&&h(PatientsView,{store:store,sm:sm,ssp:ssp}),
    view==='appointments'&&h(ApptsView,{store:store,sm:sm,tab:tab,stab:stab,ssa:ssa}),
    view==='medications'&&h(MedsView,{store:store,sm:sm,ssm:ssm}),
    view==='settings'&&h(SettingsView,{store:store,sv:sv,user:user,theme:theme,setTheme:setTheme}),
    view==='record'&&h(RecordView,{store:store,sv:sv,user:user}),
    h(BottomNav,{view:view,sv:sv,notifs:notifs.length}),
    modal==='add-patient'&&h(PatientModal,{store:store,onClose:function(){sm(null);}}),
    modal==='edit-patient'&&h(PatientModal,{store:store,patient:selP,onClose:function(){sm(null);}}),
    modal==='add-apt'&&h(AptModal,{store:store,onClose:function(){sm(null);}}),
    modal==='edit-apt'&&h(AptModal,{store:store,appt:selA,onClose:function(){sm(null);}}),
    modal==='view-apt'&&h(AptDetail,{store:store,appt:selA,onClose:function(){sm(null);},onEdit:function(){sm('edit-apt');}}),
    modal==='add-med'&&h(MedModal,{store:store,onClose:function(){sm(null);}}),
    modal==='edit-med'&&h(MedModal,{store:store,med:selM,onClose:function(){sm(null);}})
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
