<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"/>
<meta http-equiv="Pragma" content="no-cache"/>
<meta http-equiv="Expires" content="0"/>
<title>Rodme Health</title>
<meta name="description" content="Organiza las citas, medicamentos y expedientes de salud familiar en un solo lugar."/>
<meta name="theme-color" content="#F7F5F0"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Lora:ital,wght@0,500;0,600;1,400&display=swap" rel="stylesheet"/>
<style>
:root{
  --bg:#FAF8F5;--surface:#FFFFFF;--surface2:#F5F2EC;--border:#E8E2D9;
  --text:#1C1A17;--text2:#7A7368;--text3:#B5ADA3;
  --accent:#C4956A;--accent2:#E8C4A0;--accent-bg:#FDF6EE;--accent-light:#FEF9F4;
  --green:#22C55E;--green-bg:#F0FDF4;--green-border:#BBF7D0;
  --amber:#F59E0B;--amber-bg:#FFFBEB;--amber-border:#FDE68A;
  --red:#EF4444;--red-bg:#FEF2F2;--red-border:#FECACA;
  --purple:#8B5CF6;--purple-bg:#F5F3FF;
  --teal:#0EA5E9;--teal-bg:#F0F9FF;
  --sidebar:240px;
  --r:10px;--r-lg:16px;--r-xl:22px;--r-full:9999px;
  --shadow:0 1px 3px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
  --shadow-md:0 4px 20px rgba(0,0,0,.08);
  --shadow-lg:0 8px 40px rgba(0,0,0,.1);
  --shadow-xl:0 24px 64px rgba(0,0,0,.15);
  --font:'Plus Jakarta Sans',system-ui,sans-serif;
  --serif:'Lora',Georgia,serif;
  --ease:cubic-bezier(.22,1,.36,1);
  --nav-h:60px;
}
[data-theme=dark]{
  --bg:#100D09;--surface:#1A1510;--surface2:#231C14;--border:#2E2519;
  --text:#F5F0E8;--text2:#A09080;--text3:#5A5048;
  --accent:#D4A574;--accent-bg:#2A1F14;--accent-light:#1A1208;
  --green-bg:#052E16;--amber-bg:#1C1400;--red-bg:#1A0505;
  --purple-bg:#1E0A3C;--teal-bg:#0C1F30;
  --shadow:0 1px 3px rgba(0,0,0,.5),0 4px 16px rgba(0,0,0,.4);
  --shadow-xl:0 24px 64px rgba(0,0,0,.7);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{font-family:var(--font);background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;transition:background .3s,color .3s}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
input,textarea,select,button{font-family:var(--font)}
input,textarea,select{outline:none;border:1.5px solid var(--border);background:var(--surface);border-radius:var(--r);padding:11px 14px;font-size:.875rem;width:100%;color:var(--text);transition:border-color .2s,box-shadow .2s;-webkit-appearance:none;appearance:none}
input:focus,textarea:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(196,149,106,.15)}
label{font-size:.72rem;font-weight:700;color:var(--text2);letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:5px}
textarea{resize:vertical;line-height:1.6}

@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes sheetUp{from{transform:translateY(100%);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes scaleIn{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
@keyframes pulse2{0%,100%{opacity:.8;transform:scale(1)}50%{opacity:1;transform:scale(1.03)}}
.fi{animation:fadeIn .3s var(--ease) both}
.su{animation:slideUp .38s var(--ease) both}
.si{animation:scaleIn .28s var(--ease) both}
.d1{animation-delay:.04s}.d2{animation-delay:.08s}.d3{animation-delay:.12s}
.d4{animation-delay:.16s}.d5{animation-delay:.2s}

/* Layout */
.app-layout{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:0;bottom:0;z-index:200;transition:transform .3s var(--ease)}
.sidebar-logo{padding:22px 18px 18px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--border)}
.logo-mark{width:34px;height:34px;background:var(--accent);border-radius:10px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-nav{flex:1;padding:14px 10px;display:flex;flex-direction:column;gap:2px;overflow-y:auto}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:var(--r);border:none;background:transparent;color:var(--text2);cursor:pointer;width:100%;text-align:left;font-family:var(--font);font-size:.82rem;font-weight:600;transition:all .16s;letter-spacing:-.01em}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent)}
.nav-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:transparent;transition:background .16s}
.nav-item.active .nav-ico{background:var(--accent)}
.nav-badge{background:var(--red);color:white;border-radius:var(--r-full);font-size:.6rem;font-weight:800;padding:2px 6px;margin-left:auto}
.sidebar-user{padding:14px 10px;border-top:1px solid var(--border)}
.user-row{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:var(--r);cursor:pointer;transition:background .16s}
.user-row:hover{background:var(--surface2)}
.main-content{flex:1;margin-left:var(--sidebar);display:flex;flex-direction:column;min-height:100vh}
.top-bar{height:var(--nav-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 22px;position:sticky;top:0;z-index:100}
.page-content{flex:1;padding:22px;max-width:1100px;width:100%}
.mobile-header{display:none;height:54px;background:var(--surface);border-bottom:1px solid var(--border);align-items:center;justify-content:space-between;padding:0 16px;position:sticky;top:0;z-index:200}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:rgba(255,255,255,.95);border-top:1px solid var(--border);padding:6px 0 env(safe-area-inset-bottom,6px);z-index:200;backdrop-filter:blur(20px)}
[data-theme=dark] .bottom-nav{background:rgba(15,26,19,.95)}
.bn-items{display:flex}
.bn-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:5px 4px;background:none;border:none;cursor:pointer;position:relative}
.bn-lbl{font-size:.6rem;font-weight:700;color:var(--text3);letter-spacing:.02em;transition:color .2s}
.bn-btn.active .bn-lbl{color:var(--accent)}
.bn-dot{position:absolute;top:3px;right:calc(50% - 14px);width:6px;height:6px;background:var(--red);border-radius:50%;border:2px solid var(--surface)}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:190;animation:fadeIn .2s}

@media(max-width:768px){
  .sidebar{transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay.show{display:block}
  .main-content{margin-left:0}
  .top-bar{display:none}
  .mobile-header{display:flex}
  .bottom-nav{display:block}
  .page-content{padding:14px 14px 82px}
}

/* Cards */
.card{background:var(--surface);border-radius:var(--r-lg);box-shadow:var(--shadow);border:1px solid var(--border);transition:transform .2s var(--ease),box-shadow .2s}
.card:hover{box-shadow:var(--shadow-md)}
.card-flat{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border)}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:none;cursor:pointer;font-family:var(--font);font-weight:700;transition:all .16s var(--ease);border-radius:var(--r);letter-spacing:-.01em;white-space:nowrap}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--accent);color:white;padding:12px 20px;font-size:.875rem;box-shadow:0 2px 12px rgba(196,149,106,.3)}
.btn-primary:hover{background:#B5825A;box-shadow:0 4px 20px rgba(196,149,106,.35)}
.btn-success{background:var(--green);color:white;padding:12px 20px;font-size:.875rem}
.btn-ghost{background:transparent;color:var(--text2);padding:9px 14px;font-size:.8rem;font-weight:600}
.btn-ghost:hover{background:var(--surface2);color:var(--text)}
.btn-outline{background:transparent;border:1.5px solid var(--border);color:var(--text);padding:10px 16px;font-size:.875rem;font-weight:600}
.btn-outline:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-bg)}
.btn-danger{background:var(--red-bg);color:var(--red);padding:10px 14px;font-size:.82rem;border:1px solid var(--red-border);font-weight:700}
.btn-icon{background:transparent;border:none;padding:7px;border-radius:var(--r);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .14s,transform .1s;color:var(--text2)}
.btn-icon:hover{background:var(--surface2);color:var(--text)}
.btn-icon:active{transform:scale(.9)}
.btn-full{width:100%}

/* Chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:var(--r-full);font-size:.7rem;font-weight:700;letter-spacing:.02em;white-space:nowrap}
.chip-green{background:var(--green-bg);color:#15803D;border:1px solid var(--green-border)}
.chip-amber{background:var(--amber-bg);color:#B45309;border:1px solid var(--amber-border)}
.chip-red{background:var(--red-bg);color:var(--red);border:1px solid var(--red-border)}
.chip-gray{background:var(--surface2);color:var(--text2);border:1px solid var(--border)}
.chip-accent{background:var(--accent-bg);color:var(--accent);border:1px solid rgba(196,149,106,.2)}

/* Tabs */
.tab-group{display:flex;background:var(--surface2);border-radius:var(--r-full);padding:3px;gap:2px;border:1px solid var(--border)}
.tab-btn{flex:1;padding:8px 12px;border:none;border-radius:var(--r-full);font-family:var(--font);font-size:.78rem;font-weight:700;cursor:pointer;transition:all .2s;background:transparent;color:var(--text2)}
.tab-btn.on{background:var(--surface);color:var(--accent);box-shadow:var(--shadow)}

/* Sheet */
.overlay{position:fixed;inset:0;background:rgba(7,15,11,.5);backdrop-filter:blur(8px);z-index:1000;display:flex;align-items:flex-end;justify-content:center;animation:fadeIn .2s}
.sheet{background:var(--surface);border-radius:20px 20px 0 0;width:100%;max-width:580px;max-height:92vh;overflow-y:auto;animation:sheetUp .3s var(--ease);padding-bottom:env(safe-area-inset-bottom,20px)}
@media(min-width:769px){.overlay{align-items:center}.sheet{border-radius:var(--r-xl);max-height:90vh}}
.sheet-grip{width:34px;height:4px;background:var(--border);border-radius:var(--r-full);margin:10px auto 0}
.sheet-hd{padding:14px 22px 0;display:flex;align-items:flex-start;justify-content:space-between}
.sheet-title{font-family:var(--serif);font-size:1.2rem;font-weight:600}
.sheet-sub{font-size:.65rem;color:var(--text3);text-transform:uppercase;letter-spacing:.09em;font-weight:700;margin-bottom:3px}
.sheet-bd{padding:14px 22px 20px;display:flex;flex-direction:column;gap:12px}

/* Search */
.srch{position:relative}
.srch input{padding-left:36px;background:var(--surface2);border-color:transparent}
.srch input:focus{background:var(--surface);border-color:var(--accent)}
.srch-ico{position:absolute;left:11px;top:50%;transform:translateY(-50%);pointer-events:none}

/* Stats */
.stats-row{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:18px}
@media(max-width:900px){.stats-row{grid-template-columns:repeat(2,1fr)}}
.stat-card{background:var(--surface);border-radius:var(--r-lg);padding:14px 16px;border:1px solid var(--border)}
.stat-ico{width:36px;height:36px;border-radius:9px;display:flex;align-items:center;justify-content:center;margin-bottom:8px}
.stat-num{font-family:var(--serif);font-size:1.7rem;font-weight:600;line-height:1;margin-bottom:2px}
.stat-lbl{font-size:.67rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.07em}

/* Info row */
.ir{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--surface2)}
.ir:last-child{border-bottom:none}
.ir-ico{width:28px;height:28px;border-radius:8px;background:var(--surface2);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.ir-lbl{font-size:.64rem;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;font-weight:700;margin-bottom:2px}
.ir-val{font-size:.875rem;font-weight:600;color:var(--text)}

/* Avatar */
.av{border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-weight:800;color:white;overflow:hidden;flex-shrink:0}

/* Apt row */
.apt-row{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:var(--r-lg);background:var(--surface);border:1px solid var(--border);margin-bottom:8px;cursor:pointer;transition:all .18s;position:relative}
.apt-row:hover{border-color:var(--accent);box-shadow:0 2px 12px rgba(196,149,106,.1)}
.apt-avatar{width:44px;height:44px;border-radius:var(--r);background:var(--accent-bg);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-weight:800;color:var(--accent);font-size:.8rem}
.apt-time{font-size:.68rem;font-weight:700;color:var(--text3);width:38px;flex-shrink:0;text-align:right}

/* Patient card */
.pt-card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);padding:13px 15px;display:flex;gap:12px;align-items:center;margin-bottom:9px;cursor:pointer;transition:all .18s}
.pt-card:hover{border-color:var(--accent);box-shadow:var(--shadow-md)}

/* Med card */
.med-card{background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--border);padding:12px 14px;margin-bottom:8px;cursor:pointer;transition:all .18s}
.med-card:hover{border-color:var(--accent)}

/* Progress */
.prog-bar{height:4px;background:var(--surface2);border-radius:var(--r-full);overflow:hidden;margin-top:6px}
.prog-fill{height:100%;border-radius:var(--r-full);transition:width .4s var(--ease)}

/* Sec header */
.sec-hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px}
.sec-title{font-family:var(--serif);font-size:1rem;font-weight:600;color:var(--text)}

/* Page header */
.ph{margin-bottom:18px}
.ph-sub{font-size:.67rem;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.09em;margin-bottom:3px}
.ph-title{font-family:var(--serif);font-size:1.5rem;font-weight:600;line-height:1.1}

/* Form grid */
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:480px){.fg{grid-template-columns:1fr}}

/* BT grid */
.bt-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:4px}
.bt-btn{padding:8px;border-radius:9px;border:1.5px solid var(--border);background:transparent;font-family:var(--font);font-size:.8rem;font-weight:800;cursor:pointer;transition:all .15s;color:var(--text2);text-align:center}
.bt-btn.on{background:var(--accent);border-color:var(--accent);color:white}

/* IMC */
.imc{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-radius:var(--r);margin-top:5px}

/* Auth */
.auth-wrap{min-height:100vh;display:flex;align-items:stretch}
.auth-left{flex:1;background:linear-gradient(145deg,#3D2B1F 0%,#C4956A 55%,#E8C4A0 100%);display:flex;flex-direction:column;justify-content:center;padding:48px;position:relative;overflow:hidden}
.auth-left::before{content:'';position:absolute;inset:0;background:url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23ffffff' fill-opacity='0.06'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/svg%3E")}
.auth-left h2{font-family:var(--serif);font-size:2.1rem;color:white;font-weight:600;margin-bottom:12px;line-height:1.2}
.auth-left p{color:rgba(255,255,255,.75);font-size:.9rem;line-height:1.7}
.auth-feats{margin-top:30px;display:flex;flex-direction:column;gap:14px}
.auth-feat{display:flex;align-items:center;gap:10px;color:rgba(255,255,255,.88);font-size:.85rem;font-weight:500}
.auth-feat-ico{width:30px;height:30px;border-radius:9px;background:rgba(255,255,255,.18);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.auth-right{width:440px;display:flex;flex-direction:column;justify-content:center;padding:48px 40px;background:var(--bg);overflow-y:auto}
@media(max-width:768px){.auth-left{display:none}.auth-right{width:100%;padding:36px 22px}}
.auth-tabs{display:flex;border-bottom:2px solid var(--border);margin-bottom:22px}
.auth-tab{padding:10px 20px;border:none;background:transparent;font-family:var(--font);font-size:.875rem;font-weight:700;cursor:pointer;color:var(--text2);border-bottom:2px solid transparent;margin-bottom:-2px;transition:all .2s}
.auth-tab.on{color:var(--accent);border-bottom-color:var(--accent)}
.inp-wrap{position:relative}
.inp-wrap input{padding-left:40px}
.inp-ico{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--text3)}
.inp-act{position:absolute;right:10px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text3);padding:4px}

/* Settings rows */
.set-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--surface2)}
.set-row:last-child{border-bottom:none}
.set-ico{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* Empty */
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 20px;color:var(--text3)}
.empty-ico{width:52px;height:52px;background:var(--surface2);border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:12px;border:1px solid var(--border)}

/* Notif */
.notif-bar{background:var(--accent);color:white;padding:10px 16px;display:flex;align-items:center;gap:10px;font-size:.82rem;font-weight:600;position:sticky;top:0;z-index:100;animation:slideUp .3s var(--ease)}

/* Hero health card */
.health-hero{background:linear-gradient(160deg,#F5EDE0 0%,#FAF2E8 55%,#FDF8F2 100%);border-radius:var(--r-xl);padding:22px 20px 18px;margin-bottom:14px;position:relative;overflow:hidden}
[data-theme=dark] .health-hero{background:linear-gradient(160deg,#2A1F14 0%,#1F160D 55%,#150E08 100%)}
.vitals-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.vital-card{background:white;border-radius:14px;padding:13px 14px;box-shadow:0 2px 10px rgba(0,0,0,.07)}
[data-theme=dark] .vital-card{background:var(--surface2);box-shadow:none;border:1px solid var(--border)}

/* Med list item */
.med-item{display:flex;align-items:center;gap:12px;padding:13px 16px;border-bottom:1px solid var(--surface2)}
.med-item:last-child{border-bottom:none}
.med-dot{width:9px;height:9px;border-radius:50%;background:var(--accent);flex-shrink:0}

/* Reset steps */
.rst-steps{display:flex;gap:6px;margin-bottom:18px}
.rst-step{flex:1;height:3px;border-radius:var(--r-full);background:var(--border);transition:background .3s}
.rst-step.done{background:var(--accent)}

/* Cal strip */
.cal-strip{display:flex;gap:6px;overflow-x:auto;padding:3px 0 8px;-webkit-overflow-scrolling:touch}
.cal-strip::-webkit-scrollbar{display:none}
.cal-day{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 6px;border-radius:var(--r);min-width:42px;cursor:pointer;flex-shrink:0;transition:all .15s;border:1.5px solid transparent}
.cal-day:hover{background:var(--surface2)}
.cal-day.today{background:var(--accent);color:white;border-color:var(--accent)}
.cal-day.has-apt:not(.today){border-color:rgba(26,158,92,.3);background:var(--accent-bg)}
.cal-dn{font-size:.63rem;font-weight:700;text-transform:uppercase;opacity:.7}
.cal-dd{font-size:.9rem;font-weight:800}

/* ───────────────────────────────────────────────────────────────
   RODME HEALTH · Visual refresh 2026
   Diseño responsivo sobre la aplicación existente (sin perder datos)
   ─────────────────────────────────────────────────────────────── */
:root{
  --bg:#F4F8F7;--surface:#FFFFFF;--surface2:#EFF5F3;--border:#DEE9E6;
  --text:#17332F;--text2:#586F6B;--text3:#778E89;
  --accent:#087E73;--accent2:#33B7A1;--accent-bg:#E7F7F1;--accent-light:#F3FBF7;
  --green:#15976C;--green-bg:#E8F8EF;--green-border:#C6EEDB;
  --amber:#D98A20;--amber-bg:#FFF6E8;--amber-border:#F5DCB5;
  --red:#DC5761;--red-bg:#FFF0F1;--red-border:#F8CDD1;
  --purple:#7F67BD;--purple-bg:#F3EFFE;
  --teal:#2589A5;--teal-bg:#EDF7FB;
  --sidebar:258px;--r:12px;--r-lg:19px;--r-xl:28px;
  --shadow:0 2px 8px rgba(10,46,38,.025),0 12px 34px rgba(10,46,38,.045);
  --shadow-md:0 10px 30px rgba(9,52,44,.09);
  --shadow-lg:0 22px 58px rgba(6,38,32,.13);
  --shadow-xl:0 25px 75px rgba(5,40,35,.2);
  --nav-h:76px;
}
[data-theme=dark]{
  --bg:#101E1C;--surface:#192B28;--surface2:#233832;--border:#34504A;
  --text:#EFFAF6;--text2:#B0C5BE;--text3:#92AAA2;
  --accent:#68D8BE;--accent2:#34B59D;--accent-bg:#1B4137;--accent-light:#16342D;
  --green-bg:#183E30;--green-border:#28664B;
  --amber-bg:#3B2D1B;--amber-border:#654922;
  --red-bg:#3A2328;--red-border:#674048;
  --purple-bg:#302944;--teal-bg:#223944;
  --shadow:0 6px 22px rgba(0,0,0,.13);
  --shadow-md:0 10px 30px rgba(0,0,0,.2);
}
html{font-size:15px;scroll-behavior:smooth}
body{background:var(--bg);color:var(--text);line-height:1.5}
button,input,textarea,select{font:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--accent2)!important;outline-offset:3px}
input,textarea,select{min-height:44px;border-radius:12px}
label{font-size:.7rem;letter-spacing:.045em;color:var(--text2)}
.sidebar{
  background:var(--surface);border-right:1px solid var(--border);
  box-shadow:5px 0 35px rgba(14,66,54,.025);
}
.sidebar-logo{padding:28px 22px 24px;border-bottom:1px solid var(--border)}
.logo-mark{background:linear-gradient(135deg,#087E73,#28C6A8);border-radius:12px;box-shadow:0 6px 15px rgba(8,126,115,.22)}
.sidebar-nav{padding:24px 13px;gap:6px}
.nav-item{padding:11px 12px;min-height:50px;border-radius:13px;font-size:.865rem;color:var(--text2)}
.nav-item:hover{background:var(--surface2);color:var(--text)}
.nav-item.active{background:var(--accent-bg);color:var(--accent);font-weight:800}
.nav-item.active .nav-ico{background:var(--accent);box-shadow:0 5px 13px rgba(8,126,115,.23)}
.nav-ico{width:32px;height:32px;border-radius:10px}
.nav-item.active::after{content:' ';height:6px;width:6px;margin-left:auto;border-radius:100%;background:var(--accent)}
.nav-badge{margin-left:auto}
.sidebar-user{padding:15px 13px 22px;background:linear-gradient(180deg,transparent,var(--accent-light))}
.user-row{padding:11px 9px;border-radius:13px}
.main-content{min-width:0}
.top-bar{
  padding:0 clamp(22px,3vw,46px);background:var(--surface);
  border-bottom:1px solid var(--border);box-shadow:0 2px 15px rgba(15,59,47,.025);
}
.top-bar>p{font-family:var(--font)!important;font-size:1.02rem!important;font-weight:800!important}
.page-content{max-width:1320px;padding:30px clamp(22px,3vw,46px) 60px;margin:0 auto}
.card,.card-flat,.stat-card,.pt-card,.apt-row,.med-card{
  border:1px solid var(--border);box-shadow:var(--shadow);
}
.card,.card-flat{border-radius:var(--r-lg)}
.card:hover,.pt-card:hover,.apt-row:hover,.med-card:hover{box-shadow:var(--shadow-md)}
.pt-card,.apt-row,.med-card{border-radius:15px}
.pt-card,.apt-row{padding:16px 18px}
.btn{min-height:42px}
.btn-primary{background:linear-gradient(135deg,#0C8479,#0F9D8A);border-radius:12px;box-shadow:0 6px 16px rgba(8,126,115,.17)}
.btn-primary:hover{background:linear-gradient(135deg,#076D63,#0C8A78);box-shadow:0 8px 23px rgba(8,126,115,.23)}
.btn-outline{border-color:var(--border);background:var(--surface)}
.btn-outline:hover{border-color:var(--accent);background:var(--accent-bg)}
.btn-icon{min-width:40px;min-height:40px}
.av{background:linear-gradient(140deg,#188F86,#5BCEB3)}
.ph{margin-bottom:24px}
.ph-sub{font-size:.69rem;color:var(--accent);margin-bottom:8px}
.ph-title{font-family:var(--font);font-size:clamp(1.6rem,2.7vw,2.15rem);font-weight:800;letter-spacing:-.045em;line-height:1.15}
.sec-hdr{margin-bottom:13px;gap:10px}
.sec-title{font-family:var(--font);font-size:1.06rem;font-weight:800;letter-spacing:-.03em}
.sheet-title{font-family:var(--font);font-weight:800;font-size:1.35rem;letter-spacing:-.035em}
.sheet{box-shadow:var(--shadow-xl)}
.chip{padding:4px 10px;font-size:.68rem}
.chip-accent{border-color:var(--border)}
.tab-group{padding:5px;border-radius:13px}
.tab-btn{border-radius:10px;min-height:38px}
.stats-row{grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin:0 0 24px}
.stat-card{padding:20px 19px 18px;min-height:128px;border-radius:19px;position:relative;overflow:hidden}
.stat-card::after{content:'';position:absolute;right:-18px;bottom:-28px;width:90px;height:90px;border-radius:50%;background:var(--accent-bg);opacity:.55;pointer-events:none}
.stat-ico{width:40px;height:40px;border-radius:12px;margin-bottom:13px}
.stat-num{font-family:var(--font);font-weight:800;font-size:1.85rem;letter-spacing:-.055em;margin-bottom:7px}
.stat-lbl{font-size:.7rem;letter-spacing:.035em;color:var(--text2)}
.health-hero{
  display:grid;grid-template-columns:minmax(0,1.15fr) minmax(280px,.85fr);
  grid-template-rows:auto 1fr auto;align-items:center;
  gap:16px 38px;min-height:304px;
  padding:34px clamp(25px,3.2vw,42px);margin-bottom:22px;
  border-radius:26px;isolation:isolate;
  background:radial-gradient(circle at 85% 0%,rgba(93,224,183,.35),transparent 37%),
             linear-gradient(120deg,#0C514C,#116B60 65%,#238D76);
  box-shadow:0 20px 46px rgba(8,98,78,.16);
}
[data-theme=dark] .health-hero{
  background:radial-gradient(circle at 85% 0%,rgba(93,224,183,.18),transparent 38%),
             linear-gradient(120deg,#133D36,#19574A 70%,#1B6659);
}
.health-hero::after{content:'';position:absolute;width:310px;height:310px;border:1px solid rgba(255,255,255,.09);border-radius:50%;right:-116px;top:-150px;z-index:0;pointer-events:none}
.health-hero>*{position:relative;z-index:1;min-width:0}
.health-hero>div:first-child{grid-column:1;grid-row:1;margin-bottom:0!important}
.health-hero>div:first-child p{color:#F2FCFA!important;font-size:.85rem!important}
.health-hero .av{border:2px solid rgba(255,255,255,.45)}
.health-hero h1{
  grid-column:1;grid-row:2;font-family:var(--font)!important;
  font-size:clamp(1.9rem,3.2vw,3.3rem)!important;font-weight:800!important;
  letter-spacing:-.06em;line-height:1.12!important;color:#fff!important;
  max-width:540px;margin:0!important;white-space:pre-line;
}
.hero-actions{grid-column:1;grid-row:3;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.hero-cta{background:white;color:#0C6257;padding:12px 17px;border-radius:12px;box-shadow:0 5px 16px rgba(0,0,0,.1)}
.hero-cta:hover{background:#EEFCF7}
.hero-kicker{font-size:.74rem;color:rgba(255,255,255,.76);font-weight:600}
.health-hero .vitals-grid{grid-column:2;grid-row:1 / 4;margin:0;gap:13px;align-self:stretch;align-content:center}
.vital-card{
  min-width:0;min-height:173px;background:rgba(255,255,255,.96);
  border:1px solid rgba(255,255,255,.55);border-radius:18px;
  padding:20px 15px 17px;box-shadow:0 9px 25px rgba(3,51,40,.12);
  display:flex;flex-direction:column;justify-content:space-between;gap:9px;
}
.vital-card p{overflow-wrap:anywhere}
.vital-card>p:nth-child(2){font-family:var(--font)!important;font-size:clamp(1.25rem,2vw,1.7rem)!important;font-weight:800!important;letter-spacing:-.045em}
.vital-hint{font-size:.65rem;line-height:1.4;font-weight:600;color:#6F8780}
[data-theme=dark] .vital-card{background:var(--surface);border-color:var(--border)}
[data-theme=dark] .vital-hint{color:var(--text2)}
.quick-section{margin-bottom:25px}
.quick-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.quick-action{
  display:flex;align-items:center;gap:12px;width:100%;min-width:0;
  min-height:100px;padding:17px;border:1px solid var(--border);border-radius:17px;
  background:var(--surface);text-align:left;color:var(--text);cursor:pointer;
  box-shadow:var(--shadow);transition:transform .2s var(--ease),box-shadow .2s,border-color .2s;
}
.quick-action:hover{transform:translateY(-3px);border-color:var(--accent2);box-shadow:var(--shadow-md)}
.quick-action:active{transform:translateY(0)}
.quick-action-icon{width:46px;height:46px;display:grid;place-items:center;flex-shrink:0;border-radius:14px;background:var(--accent-bg);color:var(--accent)}
.action-med .quick-action-icon{background:var(--purple-bg);color:var(--purple)}
.action-patient .quick-action-icon{background:var(--teal-bg);color:var(--teal)}
.quick-action-copy{display:flex;flex-direction:column;flex:1;min-width:0;gap:3px}
.quick-action-copy strong{font-size:.85rem;letter-spacing:-.015em}
.quick-action-copy small{font-size:.69rem;color:var(--text2);line-height:1.35}
.quick-action-arrow{color:var(--text3);font-size:1.2rem;align-self:flex-start}
.med-item{padding:17px 19px;min-height:75px;gap:14px}
.med-dot{height:12px;width:12px;background:var(--accent);box-shadow:0 0 0 5px var(--accent-bg)}
.med-chevron{font-size:1.6rem;line-height:1;color:var(--text3)}
.apt-avatar{border-radius:12px;background:var(--accent-bg)}
.apt-row{margin-bottom:10px}
.auth-wrap{background:var(--bg)}
.auth-left{
  background:radial-gradient(circle at 12% 6%,rgba(112,237,193,.23),transparent 36%),
             linear-gradient(145deg,#0A5049 0%,#11695E 60%,#278D78 100%);
  padding:clamp(40px,6vw,86px);isolation:isolate;
}
.auth-left::before{background:none}
.auth-left::after{content:'';position:absolute;width:460px;height:460px;right:-180px;bottom:-260px;border:1px solid rgba(255,255,255,.19);border-radius:50%;pointer-events:none}
.auth-left>*{position:relative;z-index:1;max-width:630px}
.auth-left h2{font-family:var(--font);font-size:clamp(2.5rem,4.2vw,4.4rem);font-weight:800;letter-spacing:-.06em;white-space:pre-line;line-height:1.13}
.auth-left p{font-size:1rem;max-width:460px;color:rgba(255,255,255,.85)}
.auth-feats{gap:18px;margin-top:39px}
.auth-feat-ico{width:41px;height:41px;border-radius:13px;background:rgba(255,255,255,.15)}
.auth-right{
  width:min(490px,44vw);min-width:395px;
  padding:50px clamp(30px,3.3vw,54px);background:var(--surface);
  box-shadow:-12px 0 38px rgba(4,45,39,.04);
}
.auth-tabs{border-bottom-color:var(--border);margin-bottom:26px}
.auth-tab{padding:12px 17px}
.auth-right .btn-primary{min-height:47px}
.auth-right input{min-height:47px}
.notif-bar{background:#126F63}
@media(max-width:1050px){
  .health-hero{gap:20px;padding:28px}
  .health-hero .vitals-grid{grid-template-columns:1fr 1fr}
  .vital-card{padding:15px 11px;min-height:155px}
  .quick-action{padding:13px;gap:9px}
}
@media(max-width:900px){
  .health-hero{grid-template-columns:1fr;grid-template-rows:auto auto auto auto;gap:18px}
  .health-hero>div:first-child{grid-column:1;grid-row:1}
  .health-hero h1{grid-column:1;grid-row:2;max-width:620px}
  .health-hero .vitals-grid{grid-column:1;grid-row:3}
  .hero-actions{grid-column:1;grid-row:4}
  .stats-row{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick-grid{gap:10px}
  .quick-action{min-height:97px}
}
@media(max-width:768px){
  :root{--nav-h:65px}
  .page-content{padding:20px 16px 108px}
  .mobile-header{height:65px;padding:0 18px;background:var(--surface);box-shadow:0 2px 15px rgba(0,0,0,.025)}
  .sidebar{width:min(300px,86vw)}
  .sidebar-logo{padding-top:31px}
  .bottom-nav{
    background:rgba(255,255,255,.96);padding:8px 5px calc(8px + env(safe-area-inset-bottom,0px));
    box-shadow:0 -9px 33px rgba(15,66,54,.075);border-radius:18px 18px 0 0;
  }
  [data-theme=dark] .bottom-nav{background:rgba(25,43,40,.96)}
  .bn-btn{min-height:51px;justify-content:center;gap:4px;border-radius:12px}
  .bn-btn.active{background:var(--accent-bg)}
  .bn-lbl{font-size:.64rem}
  .health-hero{padding:25px 21px;border-radius:22px}
  .health-hero h1{font-size:clamp(1.8rem,7vw,2.6rem)!important}
  .vital-card{min-height:138px}
  .auth-wrap{min-height:100dvh;align-items:center;justify-content:center;padding:18px;background:linear-gradient(160deg,var(--accent-bg),var(--bg) 42%,var(--bg))}
  .auth-right{width:min(100%,460px);min-width:0;padding:31px 25px;border:1px solid var(--border);border-radius:24px;box-shadow:var(--shadow-md)}
}
@media(max-width:620px){
  .quick-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .quick-action{min-height:115px;align-items:flex-start;flex-direction:column;gap:8px}
  .quick-action-icon{height:37px;width:37px;border-radius:11px}
  .quick-action-arrow{display:none}
  .quick-action:last-child{grid-column:1 / -1;min-height:79px;flex-direction:row;align-items:center}
  .stats-row{gap:10px;margin-bottom:22px}
  .stat-card{min-height:113px;padding:16px}
  .stat-num{font-size:1.65rem}
  .stat-ico{width:34px;height:34px;margin-bottom:9px}
}
@media(max-width:380px){
  .page-content{padding-left:12px;padding-right:12px}
  .health-hero{padding:21px 16px}
  .vitals-grid{gap:8px}
  .vital-card{padding:12px 10px}
  .vital-card>div:first-child p{font-size:.56rem!important}
  .bn-lbl{font-size:.56rem}
  .auth-wrap{padding:8px}
  .auth-right{padding:25px 17px}
}
@media(prefers-reduced-motion:reduce){
  *,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}
}

:root{
 --bg:#F8F7F3;--surface:#FFFFFF;--surface2:#F3F1EB;--border:#E9E7DF;
 --text:#252924;--text2:#656B63;--text3:#888D83;
 --accent:#343D32;--accent2:#B4C6AD;--accent-bg:#E9EEE3;--accent-light:#F4F6EF;
 --green:#527662;--green-bg:#EDF4EC;--green-border:#D6E4D4;
 --amber:#B47D51;--amber-bg:#FFF4E8;--amber-border:#F1DEC8;
 --red:#C86963;--red-bg:#FDF0ED;--red-border:#F2D2CE;
 --purple:#766E8E;--purple-bg:#F0EDF4;--teal:#5C817B;--teal-bg:#EAF2ED;
 --shadow:0 3px 16px rgba(37,42,33,.035);--shadow-md:0 12px 35px rgba(37,42,33,.09);
 --r:12px;--r-lg:18px;--r-xl:26px;
 --serif:Georgia,'Times New Roman',serif;
}

 --green-bg:#263B2C;--green-border:#395342;--amber-bg:#402F24;--red-bg:#422D2A;
 --purple-bg:#3E3944;--teal-bg:#263B35;
}

.rh-profile-columns{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}
.rh-profile-panel{padding:24px;border-radius:13px;border:1px solid var(--border);background:var(--surface)}
.rh-profile-panel-head{display:flex;align-items:center;justify-content:space-between;gap:9px;margin-bottom:18px}
.rh-profile-panel-head h2{font-family:var(--serif);font-weight:400;font-size:1.55rem;letter-spacing:-.035em}
.rh-profile-panel-head button{border:0;background:transparent;color:var(--accent);cursor:pointer;font-weight:800;font-size:.75rem}
.rh-profile-next{display:flex;flex-direction:column;gap:4px;text-align:left;width:100%;border:0;background:var(--surface2);border-radius:9px;margin-bottom:8px;padding:14px;color:var(--text);cursor:pointer}
.rh-profile-next span{color:var(--text2);font-size:.72rem}
.rh-profile-next strong{font-size:.89rem}.rh-profile-next small,.rh-profile-med p{font-size:.73rem;color:var(--text2)}
.rh-profile-med{border-bottom:1px solid var(--border);padding:10px 0;display:flex;flex-wrap:wrap;gap:4px 10px}
.rh-profile-med strong{font-size:.87rem;flex:1}.rh-profile-med p{width:100%}.rh-profile-med span{font-size:.69rem;color:var(--text2)}
.rh-profile-muted{color:var(--text2);font-size:.82rem}
.rh-profile-timeline{padding-bottom:30px}
.rh-timeline-row{display:flex;align-items:stretch;gap:13px}
.rh-timeline-rail{display:flex;flex-direction:column;align-items:center;width:19px}
.rh-timeline-rail:after{content:'';background:var(--border);width:2px;flex:1;min-height:19px}
.rh-timeline-rail>span{display:block;width:12px;height:12px;border-radius:50%;background:var(--accent);margin-top:8px}
.rh-timeline-rail>span.dose{background:var(--green)}
.rh-timeline-rail>span.med{background:var(--amber)}
.rh-timeline-item{padding-bottom:19px;display:flex;align-items:flex-start;flex-direction:column;gap:4px;flex:1}
.rh-timeline-date{font-size:.7rem;color:var(--text2)}
.rh-timeline-item strong{font-size:.88rem}
.rh-timeline-item small{font-size:.75rem;color:var(--text2)}
.rh-timeline-status{color:var(--accent);font-size:.7rem;font-weight:800}
.rh-timeline-item button{margin-top:3px;border:0;background:transparent;color:var(--accent);font-size:.73rem;cursor:pointer;font-weight:800}
@media(max-width:750px){.rh-profile-columns{grid-template-columns:1fr}.rh-profile-hero{padding:18px;gap:12px}.rh-profile-photo{width:62px;height:62px}.rh-profile-tools{width:100%}.rh-profile-tools button{flex:1}.rh-profile-counts strong{font-size:1.9rem}.rh-profile-counts>div{padding:14px 5px}.rh-profile-counts span{font-size:.67rem}.rh-profile-panel{padding:18px}}

.rh-backup-panel{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:24px;display:flex;flex-direction:column;gap:14px;margin-bottom:15px}
.rh-backup-title{display:flex;gap:12px;align-items:flex-start}
.rh-backup-title h2{font-family:var(--serif);font-size:1.65rem;font-weight:400;line-height:1.2}
.rh-backup-title p{color:var(--text2);font-size:.75rem;margin-top:6px}
.rh-backup-tabs{display:flex;gap:5px;align-self:flex-start;border-radius:99px;background:var(--surface2);padding:4px}
.rh-backup-tabs button{border:0;border-radius:99px;background:transparent;cursor:pointer;color:var(--text2);font-weight:800;font-size:.77rem;padding:9px 16px}
.rh-backup-tabs button.active{background:var(--accent);color:#fff}
.rh-backup-description,.rh-backup-foot{font-size:.77rem;line-height:1.7;color:var(--text2)}
.rh-backup-field{display:flex;flex-direction:column;gap:6px}
.rh-backup-field span{font-size:.74rem;font-weight:700;color:var(--text2)}
.rh-backup-field input{background:var(--surface2);border:1px solid var(--border);border-radius:10px;padding:11px;width:100%;min-height:45px}
.rh-backup-main{align-self:flex-start;min-height:45px;padding:12px 23px;border-radius:99px;border:0;background:var(--accent);color:#fff;font-weight:800;font-size:.78rem;cursor:pointer}
.rh-backup-main:disabled{opacity:.6;cursor:wait}
.rh-backup-message{font-size:.79rem;line-height:1.6;font-weight:700;color:var(--text)}
.rh-backup-foot{font-size:.7rem}
@media(max-width:770px){.rh-backup-panel{padding:18px}.rh-backup-main{width:100%}}

/* Acceso rápido móvil sin saturar la barra de navegación */
.rh-quick-add{display:none}
@media(max-width:768px){
 .rh-quick-add{display:flex;position:fixed;right:17px;bottom:calc(83px + env(safe-area-inset-bottom,0px));flex-direction:column;align-items:flex-end;gap:9px;z-index:150}
 .rh-quick-toggle{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:49px;padding:10px 17px;border:0;border-radius:99px;background:#303F34;color:#fff;box-shadow:0 6px 23px rgba(26,45,32,.3);font-weight:800;font-size:.78rem;cursor:pointer}
 .rh-quick-toggle svg{flex-shrink:0}
 .rh-quick-menu{display:flex;flex-direction:column;gap:5px;min-width:207px;padding:9px;background:var(--surface);border:1px solid var(--border);border-radius:15px;box-shadow:0 11px 37px rgba(24,35,24,.2)}
 .rh-quick-menu button{display:flex;align-items:center;gap:11px;background:transparent;border:0;border-radius:10px;padding:13px 10px;cursor:pointer;text-align:left;font-size:.79rem;color:var(--text);font-weight:750}
 .rh-quick-menu button:hover,.rh-quick-menu button:focus-visible{background:var(--surface2)}
 .wix-hero{min-height:480px}
 .wix-hero-body{padding-top:80px}
}
@media(max-width:430px){.wix-hero{min-height:440px}}
@media(min-width:769px){.wix-hero{min-height:clamp(420px,55vh,570px)}}

.rh-no-patient{font-size:.81rem;line-height:1.6;color:var(--text2);padding:12px 14px;background:var(--surface2);border:1px solid var(--border);border-radius:10px}

  var medName=function(id){var m=meds.find(function(x){return x.id===id;});return m?m.name:'Medicamento';};
  var doses=(store.doseLogs||[]).filter(function(d){return d.patientId===pt.id;});

function rhCalDay(date){return date.getFullYear()+'-'+String(date.getMonth()+1).padStart(2,'0')+'-'+String(date.getDate()).padStart(2,'0');}
function rhCalDate(v){var d=new Date(v+'T12:00:00');return isNaN(d.getTime())?new Date():d;}
function rhIcsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/\n/g,'\\n').replace(/,/g,'\\,').replace(/;/g,'\\;');}
function rhDownload(content,name,type){
  var blob=new Blob([content],{type:type||'application/octet-stream'}),url=URL.createObjectURL(blob);
  var a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
  setTimeout(function(){URL.revokeObjectURL(url);},10000);
}
function rhExportCalendar(apts,patients){
  var lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//Rodme Health//Calendario personal//ES','CALSCALE:GREGORIAN','METHOD:PUBLISH'];
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  (apts||[]).forEach(function(a){
    if(!a.date||!/^20\d\d-\d\d-\d\d$/.test(a.date))return;
    var patient=(patients||[]).find(function(p){return p.id===a.patientId;});
    var title=(a.reason||a.specialty||'Cita médica')+(patient?' · '+patient.name:'');
    var description=[a.doctor?'Doctor: '+a.doctor:'',a.notes?'Notas: '+a.notes:'',a.prepInstructions?'Indicaciones: '+a.prepInstructions:''].filter(Boolean).join('\n');
    var start=a.date.replace(/-/g,''),timed=a.time&&/^\d\d:\d\d$/.test(a.time),end;
    if(timed){
      var d=rhCalDate(a.date);d.setHours(Number(a.time.slice(0,2))+1,Number(a.time.slice(3,5)),0);
      end=rhCalDay(d).replace(/-/g,'')+'T'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')+'00';
      start+='T'+a.time.replace(':','')+'00';
    }else{var dn=rhCalDate(a.date);dn.setDate(dn.getDate()+1);end=rhCalDay(dn).replace(/-/g,'');}
    lines.push('BEGIN:VEVENT','UID:rodme-'+String(a.id||uid()).replace(/[^a-zA-Z0-9_-]/g,'')+'@local','DTSTAMP:'+stamp,
      'SUMMARY:'+rhIcsEscape(title),'LOCATION:'+rhIcsEscape(a.clinic||''),'DESCRIPTION:'+rhIcsEscape(description),
      (timed?'DTSTART:':'DTSTART;VALUE=DATE:')+start,(timed?'DTEND:':'DTEND;VALUE=DATE:')+end);
    if(timed&&!a.attended){
      var minutes=Number(a.reminderMinutes);
      if(![0,60,180,1440,2880].includes(minutes))minutes=1440;
      if(minutes>0)lines.push('BEGIN:VALARM','ACTION:DISPLAY','DESCRIPTION:'+rhIcsEscape(title),'TRIGGER:-PT'+minutes+'M','END:VALARM');
    }
    lines.push('END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  rhDownload(lines.join('\r\n')+'\r\n','rodme-citas.ics','text/calendar;charset=utf-8');
}

function ApptsView(p){
  var modeState=useState('month'),mode=modeState[0],setMode=modeState[1];
  var dState=useState(function(){return rhCalDay(new Date());}),focus=dState[0],setFocus=dState[1];
  var current=rhCalDate(focus),today=rhCalDay(new Date());
  var all=p.store.appointments||[];
  var weekdays=['Lun','Mar','Mié','Jue','Vie','Sáb','Dom'];
  var first=new Date(current.getFullYear(),current.getMonth(),1,12);
  var offset=(first.getDay()+6)%7;
  var beginning=new Date(first);beginning.setDate(first.getDate()-offset);
  var count=mode==='week'?7:42;
  var weekBegin=rhCalDate(focus);weekBegin.setDate(weekBegin.getDate()-(weekBegin.getDay()+6)%7);
  function move(dir){var d=rhCalDate(focus);if(mode==='month'){d.setDate(1);d.setMonth(d.getMonth()+dir);}else d.setDate(d.getDate()+7*dir);setFocus(rhCalDay(d));}
  function openA(a){p.ssa(a);p.sm('view-apt');}
  function patient(a){return (p.store.patients||[]).find(function(x){return x.id===a.patientId;});}
  return h('div',{className:'rh-calendar-area'},
    h('div',{className:'rh-calendar-toolbar'},
      h('div',null,h('h1',null,'Citas y calendario'),h('span',null,all.filter(function(a){return !a.attended;}).length+' citas pendientes')),
      h('div',{className:'rh-calendar-toolbar-actions'},
        h('button',{className:'rh-mini-btn',onClick:function(){rhExportCalendar(all.filter(function(a){return !a.attended;}),p.store.patients);},
          disabled:!all.some(function(a){return !a.attended;})},h(Ic,{n:'calendar',s:15,c:'currentColor'}),' Exportar .ics'),
        h('button',{className:'rh-mini-btn rh-mini-primary',onClick:function(){if(p.setDraftDate)p.setDraftDate('');p.sm('add-apt');}},h(Ic,{n:'plus',s:15,c:'currentColor'}),' Nueva cita')
      )
    ),
    h('div',{className:'rh-calendar-mode',role:'group','aria-label':'Vista de citas'},
      [['month','Mes'],['week','Semana'],['list','Lista']].map(function(x){
        return h('button',{key:x[0],className:mode===x[0]?'active':'',onClick:function(){setMode(x[0]);}},x[1]);
      })
    ),
    mode==='list'?h(LegacyApptsList,p):
    h('div',{className:'rh-calendar-shell'},
      h('div',{className:'rh-calendar-switcher'},
        h('button',{onClick:function(){move(-1);},'aria-label':'Periodo anterior'},'‹'),
        h('strong',null,mode==='month'?current.toLocaleDateString('es-CR',{month:'long',year:'numeric'}):
          rhCalDate(rhCalDay(weekBegin)).toLocaleDateString('es-CR',{day:'numeric',month:'long',year:'numeric'})),
        h('button',{onClick:function(){move(1);},'aria-label':'Periodo siguiente'},'›'),
        h('button',{className:'rh-calendar-today',onClick:function(){setFocus(today);}},'Hoy')
      ),
      h('div',{className:'rh-calendar-grid',role:'grid','aria-label':'Calendario de citas'},
        weekdays.map(function(w){return h('div',{key:w,className:'rh-calendar-weekday'},w);}),

// Copias de seguridad locales cifradas, independientes de servicios externos.
function rhToB64(bytes){
  var chunks=[];
  for(var i=0;i<bytes.length;i+=8192)chunks.push(String.fromCharCode.apply(null,bytes.subarray(i,i+8192)));
  return btoa(chunks.join(''));
}
function rhFromB64(str){
  if(typeof str!=='string'||str.length>26000000||!/^[A-Za-z0-9+/]*={0,2}$/.test(str))throw Error('Archivo inválido');
  var raw=atob(str),out=new Uint8Array(raw.length);
  for(var i=0;i<raw.length;i++)out[i]=raw.charCodeAt(i);
  return out;
}
async function rhDeriveBackupKey(password,salt){
  var base=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt:salt,iterations:250000,hash:'SHA-256'},
    base,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);
}
function rhBackupPayload(user){
  return {
    app:'rodme-health',version:1,createdAt:new Date().toISOString(),
    data:{
      p:lsg(uk(user,'p'))||[],
      a:lsg(uk(user,'a'))||[],
      m:lsg(uk(user,'m'))||[],
      d:lsg(uk(user,'d'))||[],
      prefs:lsg(uk(user,'prefs'))||{},
      rec:lsg(uk(user,'rec'))||{}
    }
  };
}
function rhValidateBackup(data){
  if(!data||data.app!=='rodme-health'||data.version!==1||!data.data||typeof data.data!=='object')throw Error('El archivo no es una copia compatible');
  ['p','a','m','d'].forEach(function(k){if(!Array.isArray(data.data[k])||data.data[k].length>20000)throw Error('Datos inválidos: '+k);});
  ['prefs','rec'].forEach(function(k){var v=data.data[k];if(!v||typeof v!=='object'||Array.isArray(v))throw Error('Datos inválidos: '+k);});
  // Verificar asociaciones antes de restaurar.
  var patientIds=new Set();
  data.data.p.forEach(function(v){if(!v||typeof v.id!=='string'||!v.id||typeof v.name!=='string')throw Error('Paciente inválido');patientIds.add(v.id);});
  data.data.a.forEach(function(v){if(!v||typeof v.id!=='string'||!v.id||typeof v.date!=='string'||typeof v.patientId!=='string'||!patientIds.has(v.patientId))throw Error('Cita inválida');});
  var medIds=new Set();
  data.data.m.forEach(function(v){if(!v||typeof v.id!=='string'||!v.id||typeof v.name!=='string'||!patientIds.has(v.patientId))throw Error('Medicamento inválido');medIds.add(v.id);});
  data.data.d.forEach(function(v){if(!v||typeof v.id!=='string'||typeof v.at!=='string'||!medIds.has(v.medicationId))throw Error('Registro de dosis inválido');});
  return data.data;
}
function BackupPanel(p){
  var passState=useState(''),password=passState[0],setPassword=passState[1];
  var againState=useState(''),again=againState[0],setAgain=againState[1];
  var fileState=useState(null),file=fileState[0],setFile=fileState[1];
  var statusState=useState(''),status=statusState[0],setStatus=statusState[1];
  var busyState=useState(false),busy=busyState[0],setBusy=busyState[1];
  var modeState=useState('export'),mode=modeState[0],setMode=modeState[1];
  async function exportBackup(){
    if(busy)return;
    if(!window.crypto||!crypto.subtle){setStatus('Este navegador no admite copias cifradas.');return;}
    if(password.length<10){setStatus('Elige una contraseña de al menos 10 caracteres.');return;}
    if(password!==again){setStatus('Las contraseñas no coinciden.');return;}
    setBusy(true);setStatus('');
    try{
      var salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
      var key=await rhDeriveBackupKey(password,salt);
      var plaintext=new TextEncoder().encode(JSON.stringify(rhBackupPayload(p.user)));

      var wrapper={format:'rodme-health-encrypted',version:1,kdf:'PBKDF2-SHA256',iterations:250000,

      setStatus('Copia cifrada descargada. Guarda la contraseña en un lugar seguro: no podremos recuperarla.');
      setPassword('');setAgain('');

    finally{setBusy(false);}

    if(file.size>19000000){setStatus('El archivo supera el límite de 19 MB.');return;}
    if(!window.crypto||!crypto.subtle){setStatus('Este navegador no permite descifrar la copia.');return;}

      var envelope=JSON.parse(await file.text());
      if(!envelope||envelope.format!=='rodme-health-encrypted'||envelope.version!==1||
        envelope.cipher!=='AES-256-GCM'||envelope.iterations!==250000)throw Error('Formato no compatible');
      var salt=rhFromB64(envelope.salt),iv=rhFromB64(envelope.iv);
      if(salt.length!==16||iv.length!==12)throw Error('Parámetros inválidos');
      var key=await rhDeriveBackupKey(password,salt);

      var keys=['p','a','m','d','prefs','rec'],old={};
      keys.forEach(function(k){old[k]=localStorage.getItem(uk(p.user,k));});
      try{keys.forEach(function(k){localStorage.setItem(uk(p.user,k),JSON.stringify(data[k]));});}
      catch(e){
        keys.forEach(function(k){try{if(old[k]===null)localStorage.removeItem(uk(p.user,k));else localStorage.setItem(uk(p.user,k),old[k]);}catch(ignored){}});
        throw Error('No hay suficiente espacio para restaurar los registros');
      }

    }catch(e){
      setStatus(e.name==='OperationError'?'Contraseña incorrecta o archivo dañado.':(e.message||'No se pudo leer la copia.'));
    }finally{setBusy(false);}
  }
  function switchMode(m){setMode(m);setStatus('');setPassword('');setAgain('');}
  return h('section',{className:'rh-backup-panel'},
    h('div',{className:'rh-backup-title'},h(Ic,{n:'shield',s:19,c:'var(--accent)'}),
      h('div',null,h('h2',null,'Copias de seguridad'),h('p',null,'Protege tus registros con una copia cifrada y recuperable.'))),
    h('div',{className:'rh-backup-tabs',role:'group','aria-label':'Copia o restauración'},
      h('button',{className:mode==='export'?'active':'',onClick:function(){switchMode('export');}},'Guardar copia'),

    mode==='import'&&h('label',{className:'rh-backup-field'},h('span',null,'Archivo de copia'),
      h('input',{type:'file',accept:'.rhbackup,application/json',onChange:function(e){setFile(e.target.files&&e.target.files[0]||null);setStatus('');}})),
    h('label',{className:'rh-backup-field'},h('span',null,mode==='export'?'Contraseña para cifrar':'Contraseña de la copia'),
