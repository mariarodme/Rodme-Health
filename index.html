.ch{transition:transform .25s cubic-bezier(.22,1,.36,1),box-shadow .25s}

.bp{transition:transform .15s,opacity .15s;cursor:pointer}

.fr{display:flex;gap:12px}.fr>*{flex:1}

.tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:11px;font-weight:500}
.chip{padding:6px 14px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;transition:all .2s;border:1.5px solid #E2DDD7;background:transparent;color:#6B6560;font-family:'DM Sans',sans-serif}
.on{background:#1A1A2E!important;color:#fff!important;border-color:#1A1A2E!important}
.av{width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#7C9A92,#A8C5BD);display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;color:#fff;overflow:hidden;flex-shrink:0}
.nd{width:8px;height:8px;background:#E8735A;border-radius:50%;position:absolute;top:-2px;right:-2px;border:2px solid #fff;animation:pulse 2s infinite}
.s1{animation-delay:.05s;opacity:0}.s2{animation-delay:.1s;opacity:0}.s3{animation-delay:.15s;opacity:0}.s4{animation-delay:.2s;opacity:0}.s5{animation-delay:.25s;opacity:0}

              onfocus="rhFocus(this)" onblur="rhBlur(this)"/>

<script>
// ══════════════════════════════════════════════════════════════
//  RODME HEALTH — CONFIGURACION DE ACCESO
// ══════════════════════════════════════════════════════════════

// 1. CORREOS DE GOOGLE AUTORIZADOS
//    Agrega aqui los correos que pueden entrar con Google
var ALLOWED_EMAILS = [
  'arodriguezme9@gmail.com',    // Maria
  'rodmemariabe@gmail.com'      // Familiar
];

// 2. USUARIOS CON CONTRASENA (acceso alternativo)
//    Formato: 'usuario': 'contrasena'
var USERS = {
  'admin':   'rodme2024',      // Tu usuario — CAMBIA ESTO
  'familia': 'salud2024'       // Segunda persona — CAMBIA ESTO
};

// ── NO CAMBIES NADA DEBAJO DE ESTA LINEA ──────────────────────
var RH_KEY = 'rodme_session';

function rhFocus(el){ el.style.borderColor='#7C9A92'; el.style.boxShadow='0 0 0 3px rgba(124,154,146,.12)'; }
function rhBlur(el){ el.style.borderColor='#E2DDD7'; el.style.boxShadow='none'; }

function rhShowTab(tab){
  var isGoogle = tab==='google';
  document.getElementById('panel-google').style.display = isGoogle?'block':'none';
  document.getElementById('panel-manual').style.display = isGoogle?'none':'block';
  var tg=document.getElementById('tab-google'),tm=document.getElementById('tab-manual');
  tg.style.background=isGoogle?'#1A1A2E':'transparent';
  tg.style.color=isGoogle?'white':'#A8A29E';
  tm.style.background=isGoogle?'transparent':'#1A1A2E';
  tm.style.color=isGoogle?'#A8A29E':'white';
}

function rhToggleEye(){
  var inp=document.getElementById('pwd-input'),ico=document.getElementById('eye-icon');
  if(inp.type==='password'){
    inp.type='text';
    ico.innerHTML='<path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>';
  } else {
    inp.type='password';
    ico.innerHTML='<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
  }
}

function rhShake(){
  var box=document.getElementById('login-wall').firstElementChild;
  var steps=[9,-9,6,-6,3,-3,0]; var i=0;
  var t=setInterval(function(){box.style.transform='translateX('+steps[i]+'px)';i++;if(i>=steps.length){clearInterval(t);box.style.transform='';}},65);
}

function rhEnter(user){
  var remember=document.getElementById('remember-me');
  var storage=(remember&&remember.checked)?localStorage:sessionStorage;
  storage.setItem(RH_KEY,JSON.stringify({u:user,t:Date.now()}));
  var wall=document.getElementById('login-wall');
  wall.style.transition='opacity .4s';
  wall.style.opacity='0';
  setTimeout(function(){wall.style.display='none';},400);
}

// Google callback
function rhGoogleCallback(response){
  try{
    var parts=response.credential.split('.');
    var payload=JSON.parse(atob(parts[1].replace(/-/g,'+').replace(/_/g,'/')));
    var email=(payload.email||'').toLowerCase();
    if(email){
      rhEnter('google:'+email);
    } else {
      document.getElementById('g-error').style.display='block';
    }
  }catch(e){
    document.getElementById('g-error').style.display='block';
  }
}

// Manual login
function rhLogin(){
  var usr=document.getElementById('usr-input').value.trim().toLowerCase();
  var pwd=document.getElementById('pwd-input').value;
  var err=document.getElementById('rh-error');
  if(USERS[usr]&&USERS[usr]===pwd){
    err.style.display='none';
    rhEnter(usr);
  } else {
    err.style.display='block';
    rhShake();
    document.getElementById('pwd-input').value='';
    document.getElementById('pwd-input').focus();
  }
}

// Auto-restore sesion
(function(){
  var sess=null;
  try{
    var raw=sessionStorage.getItem(RH_KEY)||localStorage.getItem(RH_KEY);
    sess=raw?JSON.parse(raw):null;
  }catch(e){}
  if(sess&&sess.u){
    var u=sess.u;
    var ok=false;
    if(u.indexOf('google:')=== 0){
      ok=true;
    } else {
      ok=!!USERS[u];
    }
    if(ok){ document.getElementById('login-wall').style.display='none'; }
  }
})();
</script>

// ── PDF GENERATOR ──────────────────────────────────────────────────────────
function generatePDF(record, store, directPatient){
  var patient = directPatient || null;
  if(!patient){
    for(var i=0;i<store.patients.length;i++){
      if(store.patients[i].id===record.patientId){ patient=store.patients[i]; break; }
    }
  }
  if(!patient){ alert('Selecciona un paciente primero.'); return; }

  // If called from patient card, load their record
  if(directPatient){
    try{ var saved=JSON.parse(localStorage.getItem('mh_record')||'{}'); record=Object.assign({patientId:directPatient.id},saved); }catch(e){ record={patientId:directPatient.id}; }
  }

  var apts = store.appointments.filter(function(a){ return a.patientId===patient.id; });
  var meds = store.medications.filter(function(m){ return m.patientId===patient.id; });
  var pending = apts.filter(function(a){ return !a.attended; }).sort(function(a,b){return new Date(a.date)-new Date(b.date);});
  var attended = apts.filter(function(a){ return a.attended; }).sort(function(a,b){return new Date(b.date)-new Date(a.date);});

  function row(label, value){
    if(!value) return '';
    return '<tr><td style="padding:7px 12px;font-weight:600;color:#6B6560;font-size:11px;text-transform:uppercase;letter-spacing:.05em;width:160px;vertical-align:top;border-bottom:1px solid #F7F5F2">'+label+'</td><td style="padding:7px 12px;color:#1A1A2E;font-size:13px;border-bottom:1px solid #F7F5F2">'+value+'</td></tr>';
  }
  function section(title, color, rows){
    if(!rows.trim()) return '';
    return '<div style="margin-bottom:24px;break-inside:avoid"><div style="background:'+color+';border-radius:10px;padding:9px 16px;margin-bottom:0;border-radius:10px 10px 0 0"><h3 style="color:white;font-size:13px;font-weight:600;margin:0;letter-spacing:.03em">'+title+'</h3></div><table style="width:100%;border-collapse:collapse;border:1px solid #EDE9E4;border-top:none;border-radius:0 0 10px 10px;overflow:hidden">'+rows+'</table></div>';
  }
  function aptCard(a){
    var d=a.date?new Date(a.date+'T00:00:00').toLocaleDateString('es-CR',{day:'2-digit',month:'long',year:'numeric'}):'';
    var t=a.time?(function(x){var p=x.split(':'),hr=parseInt(p[0]);return(hr>12?hr-12:(hr||12))+':'+p[1]+' '+(hr>=12?'PM':'AM');})(a.time):'';
    return '<div style="border:1px solid #E2DDD7;border-radius:10px;padding:12px 16px;margin-bottom:10px;break-inside:avoid">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">'
        +'<strong style="font-size:14px;color:#1A1A2E">Dr. '+a.doctor+'</strong>'
        +'<span style="font-size:11px;background:'+(a.attended?'#EEF4F3':'#FEF5EC')+';color:'+(a.attended?'#5A9A8A':'#D4895A')+';padding:3px 10px;border-radius:20px;font-weight:600">'+(a.attended?'Asistida':'Pendiente')+'</span>'
      +'</div>'
      +(a.specialty?'<div style="font-size:12px;color:#7C9A92;margin-bottom:4px;font-weight:500">'+a.specialty+'</div>':'')
      +'<div style="font-size:12px;color:#6B6560;margin-bottom:4px">'+d+(t?' &bull; '+t:'')+(a.clinic?' &bull; '+a.clinic:'')+'</div>'
      +(a.address?'<div style="font-size:12px;color:#A8A29E">Direccion: '+a.address+'</div>':'')
      +(a.reason?'<div style="font-size:12px;color:#A8A29E;margin-top:3px">Motivo: '+a.reason+'</div>':'')
      +(a.type==='private'&&a.amount?'<div style="font-size:12px;color:#D4895A;margin-top:3px;font-weight:500">Monto: CRC '+Number(a.amount).toLocaleString()+(a.deposit?' | Deposito: CRC '+Number(a.deposit).toLocaleString()+' | Saldo: CRC '+(Number(a.amount)-Number(a.deposit)).toLocaleString():'')+'</div>':'')
      +(a.notes?'<div style="font-size:12px;color:#A8A29E;margin-top:3px">Notas: '+a.notes+'</div>':'')
      +(a.attendedNotes?'<div style="font-size:12px;color:#5A9A8A;margin-top:3px;font-weight:500">Post-cita: '+a.attendedNotes+'</div>':'')
      +'</div>';
  }
  function medCard(m){
    return '<div style="border:1px solid #E2DDD7;border-radius:10px;padding:12px 16px;margin-bottom:10px;break-inside:avoid">'
      +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">'
        +'<strong style="font-size:14px;color:#1A1A2E">'+m.name+'</strong>'
        +'<span style="font-size:11px;background:'+(m.type==='ccss'?'#E8F4F8':'#FEF5EC')+';color:'+(m.type==='ccss'?'#5A8FA8':'#D4895A')+';padding:3px 10px;border-radius:20px;font-weight:600">'+(m.type==='ccss'?'CCSS':'Privado')+'</span>'
      +'</div>'
      +(m.dosage||m.frequency?'<div style="font-size:12px;color:#6B6560">'+(m.dosage||'')+(m.frequency?' &bull; '+m.frequency:'')+'</div>':'')
      +(m.notes?'<div style="font-size:12px;color:#A8A29E;margin-top:3px">'+m.notes+'</div>':'')
      +'</div>';
  }

  var today=new Date().toLocaleDateString('es-CR',{day:'2-digit',month:'long',year:'numeric'});
  var bmi='';
  if(record.weight&&record.height){
    var b=(Number(record.weight)/Math.pow(Number(record.height)/100,2)).toFixed(1);
    var bl=b<18.5?'Bajo peso':b<25?'Normal':b<30?'Sobrepeso':'Obesidad';
    bmi=b+' ('+bl+')';
  }

  var totalApts=apts.length;
  var totalMeds=meds.length;

  var html='<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"/>'
    +'<title>Expediente - '+patient.name+'</title>'
    +'<style>'
      +'*{box-sizing:border-box;margin:0;padding:0}'
      +'body{font-family:Arial,sans-serif;background:#fff;color:#1A1A2E;padding:36px;font-size:13px}'
      +'@media print{'
        +'body{padding:20px}'
        +'.no-print{display:none!important}'
        +'@page{margin:1.5cm;size:A4}'
      +'}'
    +'</style>'
    +'</head><body>'

    // ── HEADER ─────────────────────────────────────────────
    +'<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;padding-bottom:16px;border-bottom:3px solid #7C9A92">'
      +'<div style="display:flex;align-items:center;gap:12px">'
        +'<div style="width:44px;height:44px;background:linear-gradient(135deg,#7C9A92,#A8C5BD);border-radius:12px;display:flex;align-items:center;justify-content:center">'
          +'<svg width="24" height="24" fill="none" stroke="white" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>'
        +'</div>'
        +'<div>'
          +'<div style="font-size:20px;font-weight:700;color:#1A1A2E;font-family:serif">Rodme Health</div>'
          +'<div style="font-size:11px;color:#A8A29E;letter-spacing:.05em;text-transform:uppercase">Expediente Medico Digital</div>'
        +'</div>'
      +'</div>'
      +'<div style="text-align:right">'
        +'<div style="font-size:11px;color:#A8A29E;text-transform:uppercase;letter-spacing:.05em">Generado el</div>'
        +'<div style="font-size:13px;font-weight:600;color:#1A1A2E">'+today+'</div>'
        +'<div style="margin-top:6px;display:flex;gap:8px;justify-content:flex-end">'
          +'<span style="font-size:11px;background:#EEF4F3;color:#5A9A8A;padding:2px 10px;border-radius:20px;font-weight:600">'+totalApts+' citas</span>'
          +'<span style="font-size:11px;background:#F3EEF4;color:#A875A8;padding:2px 10px;border-radius:20px;font-weight:600">'+totalMeds+' medicamentos</span>'
        +'</div>'
      +'</div>'
    +'</div>'

    // ── PACIENTE BANNER ─────────────────────────────────────
    +'<div style="background:linear-gradient(135deg,#7C9A92,#A8C5BD);border-radius:14px;padding:18px 22px;margin-bottom:24px;color:white">'
      +'<div style="font-size:22px;font-weight:700;font-family:serif;margin-bottom:4px">'+patient.name+'</div>'
      +(patient.whatsapp?'<div style="font-size:12px;opacity:.9;margin-top:3px">WhatsApp: '+patient.whatsapp+'</div>':'')
      +(patient.notes?'<div style="font-size:12px;opacity:.85;margin-top:4px;font-style:italic">'+patient.notes+'</div>':'')
    +'</div>'

    // ── DATOS VITALES ───────────────────────────────────────
    +section('Datos Vitales','#7C9A92',
      row('Tipo de sangre',record.bloodType)
      +row('Peso',record.weight?record.weight+' kg':'')
      +row('Altura',record.height?record.height+' cm':'')
      +row('IMC',bmi)
    )

    // ── ALERGIAS ────────────────────────────────────────────
    +section('Alergias y Condiciones','#E8B88A',
      row('Alergias conocidas',record.allergies)
      +row('Condiciones cronicas',record.chronicConditions)
    )

    // ── HISTORIAL ───────────────────────────────────────────
    +section('Historial Medico','#5A8FA8',
      row('Cirugias previas',record.surgeries)
      +row('Antecedentes familiares',record.familyHistory)
      +row('Vacunas aplicadas',record.vaccines)
    )

    // ── SEGURO ──────────────────────────────────────────────
    +section('Seguro y Emergencias','#C4A8C5',
      row('Aseguradora',record.insurance)
      +row('No. de poliza',record.insuranceNumber)
      +row('Contacto de emergencia',record.emergencyContact)
      +row('Telefono de emergencia',record.emergencyPhone)
    )

    // ── NOTAS ───────────────────────────────────────────────
    +(record.notes?section('Notas Adicionales','#A8A29E',row('Notas',record.notes)):'')

    // ── CITAS PENDIENTES ────────────────────────────────────
    +(pending.length>0
      ?'<div style="margin-bottom:24px">'
        +'<div style="background:#E8735A;border-radius:10px 10px 0 0;padding:9px 16px">'
          +'<h3 style="color:white;font-size:13px;font-weight:600;margin:0">Citas Pendientes &mdash; '+pending.length+'</h3>'
        +'</div>'
        +'<div style="border:1px solid #E2DDD7;border-top:none;border-radius:0 0 10px 10px;padding:12px">'
          +pending.map(aptCard).join('')
        +'</div>'
      +'</div>'
      :'')

    // ── CITAS ASISTIDAS ─────────────────────────────────────
    +(attended.length>0
      ?'<div style="margin-bottom:24px">'
        +'<div style="background:#7C9A92;border-radius:10px 10px 0 0;padding:9px 16px">'
          +'<h3 style="color:white;font-size:13px;font-weight:600;margin:0">Citas Asistidas &mdash; '+attended.length+'</h3>'
        +'</div>'
        +'<div style="border:1px solid #E2DDD7;border-top:none;border-radius:0 0 10px 10px;padding:12px">'
          +attended.map(aptCard).join('')
        +'</div>'
      +'</div>'
      :'')

    // ── MEDICAMENTOS ────────────────────────────────────────
    +(meds.length>0
      ?'<div style="margin-bottom:24px">'
        +'<div style="background:#A875A8;border-radius:10px 10px 0 0;padding:9px 16px">'
          +'<h3 style="color:white;font-size:13px;font-weight:600;margin:0">Medicamentos &mdash; '+meds.length+'</h3>'
        +'</div>'
        +'<div style="border:1px solid #E2DDD7;border-top:none;border-radius:0 0 10px 10px;padding:12px">'
          +meds.map(medCard).join('')
        +'</div>'
      +'</div>'
      :'')

    // ── FOOTER ──────────────────────────────────────────────
    +'<div style="margin-top:32px;padding-top:16px;border-top:1px solid #EDE9E4;display:flex;justify-content:space-between;align-items:center">'
      +'<div style="font-size:11px;color:#C8C0B8">Rodme Health &bull; Expediente generado el '+today+'</div>'
      +'<div style="font-size:11px;color:#C8C0B8">Confidencial &bull; Solo para uso medico</div>'
    +'</div>'

    // ── BOTONES (no imprimir) ────────────────────────────────
    +'<div class="no-print" style="margin-top:28px;display:flex;gap:12px;justify-content:center">'
      +'<button onclick="window.print()" style="padding:13px 28px;background:#1A1A2E;border:none;color:white;font-family:Arial,sans-serif;font-size:14px;font-weight:600;border-radius:12px;cursor:pointer">Descargar PDF</button>'
      +'<button onclick="window.close()" style="padding:13px 28px;background:#F7F5F2;border:1.5px solid #E2DDD7;color:#6B6560;font-family:Arial,sans-serif;font-size:14px;font-weight:500;border-radius:12px;cursor:pointer">Cerrar</button>'
    +'</div>'
    +'</body></html>';

  var win=window.open('','_blank');
  win.document.write(html);
  win.document.close();
  // Auto trigger print dialog after load
  win.onload=function(){ setTimeout(function(){ /* user clicks button */ },500); };
}

ReactDOM.createRoot(document.getElementById('root')).render(h(App));
</script>
</body>
</html>
